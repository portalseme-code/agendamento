/* ============================ régua do dia ============================ */
function segmentos(eventos, data) {
  const d0 = parseYmd(data).getTime(), d1 = d0 + 864e5;
  return eventos.map(ev => {
    const s = parseDT(ev.inicio).getTime(), e = parseDT(ev.fim).getTime();
    if (e <= d0 || s >= d1) return null;
    return { ev, a: Math.max(0, (s - d0) / 6e4), b: Math.min(1440, (e - d0) / 6e4) };
  }).filter(Boolean).sort((x, y) => x.a - y.a || y.b - x.b);
}
const ehPre = ev => ev.info ? ev.info.status === 'PRE_AGENDADA' : /\(pré\)/.test(ev.titulo || '');

function Regua({ data, eventos, capacidade, janelas = [], conflito, onBloco }) {
  const segs = segmentos(eventos, data);
  const lanes = [];
  segs.forEach(sg => {
    let i = lanes.findIndex(fim => fim <= sg.a);
    if (i === -1) { i = lanes.length; lanes.push(0); }
    lanes[i] = sg.b; sg.lane = i;
  });
  const n = Math.max(capacidade, lanes.length, 1);
  let lo = 6 * 60, hi = 20 * 60;
  segs.forEach(s => { if (s.b - s.a < 1440) { lo = Math.min(lo, s.a); hi = Math.max(hi, s.b); } });
  janelas.forEach(j => { lo = Math.min(lo, j.a); hi = Math.max(hi, j.b); });
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
  const span = hi - lo;
  const pos = m => `${((Math.min(Math.max(m, lo), hi) - lo) / span) * 100}%`;
  const larg = (a, b) => `${((Math.min(b, hi) - Math.max(a, lo)) / span) * 100}%`;
  const altura = `calc(${n} * var(--lh) + ${n - 1} * var(--gap))`;
  const passo = span > 16 * 60 ? 4 : 2;
  const horas = [];
  for (let m = lo; m <= hi; m += 60) horas.push(m);
  return (
    <div className="regua">
      <div className="regua-trilha" style={{ height: altura }}>
        {horas.map(m => <div key={m} className="regua-hora" style={{ left: pos(m) }} />)}
        {Array.from({ length: n }).map((_, i) => <div key={i} className="regua-pista" style={{ top: `calc(${i} * (var(--lh) + var(--gap)))` }} />)}
        {segs.filter(s => s.b > lo && s.a < hi).map((s, k) => {
          const w = (Math.min(s.b, hi) - Math.max(s.a, lo)) / span;
          const cls = 'regua-bloco' + (s.ev.meu ? ' meu' : '') + (s.ev.bloqueio ? ' bloq' : ehPre(s.ev) ? ' pre' : '') + (s.lane >= capacidade ? ' excesso' : '') + (onBloco ? ' clic' : '');
          const hora = s.ev.diaTodo ? 'dia inteiro' : `${s.ev.inicio.slice(11)} às ${s.ev.fim.slice(11)}`;
          const nome = s.ev.info ? `${s.ev.info.destino}, ${s.ev.info.solicitante}` : (s.ev.titulo || 'Ocupado');
          return (
            <button key={k} type="button" className={cls} tabIndex={onBloco ? 0 : -1} title={`${nome} — ${hora}`}
              aria-label={`${nome}, ${hora}`} onClick={onBloco ? () => onBloco(s.ev) : undefined}
              style={{ left: pos(s.a), width: larg(s.a, s.b), top: `calc(${s.lane} * (var(--lh) + var(--gap)))` }}>
              {w > 0.14 ? (s.ev.placa || 'Ocupado') : ''}
            </button>
          );
        })}
        {janelas.filter(j => j.b > j.a).map((j, i) => <div key={i} className={'regua-janela' + (conflito ? ' conflito' : '')} style={{ left: pos(j.a), width: larg(j.a, j.b) }} />)}
      </div>
      <div className="regua-escala">
        {horas.filter(m => ((m / 60) % passo) === 0).map(m => <span key={m} style={{ left: pos(m) }}>{m / 60}h</span>)}
      </div>
    </div>
  );
}

function Legenda({ capacidade }) {
  return (
    <div className="legenda">
      <span>Cada faixa é um dos {capacidade} veículos</span>
      <span><i style={{ background: 'var(--slate)' }} />Confirmado</span>
      <span><i className="hachura" />Pré-agendado</span>
      <span><i style={{ background: 'var(--pine)' }} />Seu pedido</span>
      <span><i className="hachura-bloq" />Bloqueado</span>

  );

/* ============================ situações ============================ */
const STATUS = {
  PENDENTE: 'Aguardando aprovação',
  ALTERACAO_PENDENTE: 'Alteração aguardando aprovação',
  PRE_AGENDADA: 'Pré-agendado',
  APROVADA: 'Confirmado',
  RECUSADA: 'Recusado',
  CANCELADA: 'Cancelado',
};
const AGENDADA = s => ['PRE_AGENDADA', 'APROVADA'].includes(s.status);
const ativa = s => ['PENDENTE', 'ALTERACAO_PENDENTE', 'PRE_AGENDADA', 'APROVADA'].includes(s.status);
const futura = s => s.data >= hojeStr();
const diasAte = data => Math.round((parseYmd(data) - parseYmd(hojeStr())) / 864e5);
const quandoFalta = data => { const n = diasAte(data); return n <= 0 ? 'é hoje' : n === 1 ? 'é amanhã' : `faltam ${n} dias`; };
const DIAS_ALERTA = 3;
const preProximo = s => s.status === 'PRE_AGENDADA' && s.tipo !== 'ENCAIXE' && futura(s) && diasAte(s.data) <= DIAS_ALERTA;

function Historico({ itens }) {
  if (!itens || !itens.length) return null;
  return (
    <details className="hist" onClick={e => e.stopPropagation()}>
      <summary>Histórico ({itens.length})</summary>
      <ol>{itens.slice().reverse().map((h, i) => <li key={i}>{h.acao}<span>{h.por}, {h.em.split(' ').map((p, j) => j === 0 ? fmtCurta(p) : ' às ' + p.slice(0, 5))}</span></li>)}</ol>
    </details>
  );
}

          {s.passageiros.length} {s.passageiros.length === 1 ? 'pessoa' : 'pessoas'}: {s.passageiros.join(', ')}
        </p>

        {AGENDADA(s) && <p className="sol-info">{s.placa && <>Veículo <b>{s.placa}</b>, </>}motorista <b>{s.motorista || 'a definir'}</b></p>}

/* ============================ prévia de uma viagem da agenda ============================ */

          <dt>Veículo</dt><dd>{i.placa || '—'}{i.modelo ? ` (${i.modelo})` : ''}</dd>

/* ============================ agenda semanal ============================ */
function Agenda({ usuario, pedirNoDia, abrirSol, pedirEncaixe }) {
  const aviso = useAviso();
  const admin = usuario.tipo === 'admin';
  const hoje0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const [inicio, setInicio] = useState(hoje0);
  const [dados, setDados] = useState(null);
  const [aberto, setAberto] = useState(null);
  const fim = addDias(inicio, 6);
  const carregar = useCallback(async () => {
    setDados(null);
    try { setDados(await api('disponibilidade', { inicio: ymd(inicio), fim: ymd(fim) })); }
    catch (e) { aviso('erro', e.message); setDados({ eventos: [], veiculos: [], pendentes: [] }); }
  }, [inicio]);
  useEffect(() => { carregar(); }, [carregar]);
  const dias = Array.from({ length: 7 }).map((_, i) => ymd(addDias(inicio, i)));
  const rotSemana = `${inicio.getDate()} ${MESES_C[inicio.getMonth()]} a ${fim.getDate()} ${MESES_C[fim.getMonth()]}`;
  const abrir = ev => { if (admin && ev.solicitacaoId) abrirSol(ev.solicitacaoId); else setAberto(ev); };

  return (
    <>
      <div className="cab">
        <div><h1>Agenda</h1><p>{admin ? 'Tudo o que está no Google Agenda e os pedidos aguardando.' : 'Toque numa viagem para ver os detalhes ou pedir encaixe.'}</p></div>
        <div className="semana-nav">
          <button className="btn contorno pequeno" onClick={() => setInicio(addDias(inicio, -7))} aria-label="Semana anterior">{I.esq}</button>
          <strong>{rotSemana}</strong>
          <button className="btn contorno pequeno" onClick={() => setInicio(addDias(inicio, 7))} aria-label="Próxima semana">{I.dir}</button>
          <button className="btn pequeno" onClick={() => setInicio(hoje0())}>Hoje</button>
        </div>
      </div>
      <div className="painel">
        {!dados ? <Carregando /> : (() => {
          const capac = Math.max(1, dados.veiculos.length);
          return (<>
            {dias.map(dia => {
              const segs = segmentos(dados.eventos, dia);
              const d = parseYmd(dia);
              const passado = dia < hojeStr();
              const pend = (dados.pendentes || []).filter(s => (s.proposta ? s.proposta.data : s.data) === dia);
              return (
                <section key={dia} className={'dia' + (dia === hojeStr() ? ' hoje' : '')} style={passado ? { opacity: .55 } : null}>
                  <div className="dia-rot"><span>{DIAS_C[d.getDay()]}</span><b>{d.getDate()}</b><em>{MESES_C[d.getMonth()]}</em></div>
                  <div style={{ minWidth: 0 }}>
                    <Regua data={dia} eventos={dados.eventos} capacidade={capac} onBloco={abrir} />
                    {(segs.length > 0 || pend.length > 0) && (
                      <div className="dia-itens">
                        {segs.map((s, i) => <ItemAgenda key={i} ev={s.ev} onClick={() => abrir(s.ev)} />)}
                        {pend.map(s => {
                          const p = s.proposta || s;
                          return (
                            <button key={s.id} type="button" className="dia-item pend" onClick={() => abrirSol(s.id)}>
                              <time>{p.horaIda}–{p.horaRetorno}</time>
                              <span className="dia-item-txt"><b>{p.destino}</b><span>{s.solicitante}, aguardando sua aprovação</span></span>
                              <span className="pill PENDENTE">{s.tipo === 'ENCAIXE' ? 'Encaixe' : 'Pedido'}</span>
                            </button>
                          );
                        })}
                      </div>
                    )}
                    <div className="dia-rodape">
                      {segs.length === 0 ? <span className="livre-txt">Todos os {capac} veículos livres</span> : <span />}
                      {!passado && <button className="btn contorno pequeno" onClick={() => pedirNoDia(dia)}>{admin ? 'Agendar neste dia' : 'Pedir carro neste dia'}</button>}
                    </div>
                  </div>
                </section>
              );
            })}
            <Legenda capacidade={capac} />
          </>);
        })()}
      </div>
      {aberto && <ViagemModal ev={aberto} fechar={() => setAberto(null)} pedirEncaixe={admin ? null : pedirEncaixe} />}
    </>
  );
}

/* ============================ formulário de pedido ============================ */

function FormSolicitacao({ inicial, editando, concluir, cancelar, pedirEncaixe, admin, usuario }) {
  const aviso = useAviso();
  const [todas, setTodas] = useState([]);
  const [mots, setMots] = useState([]);
  const [ad, setAd] = useState({ solicitante: usuario ? usuario.nome : '', setor: '', veiculoId: '', modoMot: 'agora', motorista: '', obs: '' });
  useEffect(() => {
    if (!admin) return;
    api('listarSolicitacoes').then(setTodas).catch(() => { });
    api('motoristas').then(l => setMots(l.filter(m => m.ativo))).catch(() => { });
  }, []);
  const base = editando ? (editando.proposta || editando) : null;
  const [f, setF] = useState(() => ({
    data: base ? base.data : (inicial || proxDiaUtil()),
    horaIda: base ? base.horaIda : '',
    horaRetorno: base ? base.horaRetorno : '',
    destino: base ? base.destino : '',
    passageiros: base ? base.passageiros.join('\n') : '',
    finalidade: base ? base.finalidade || '' : '',
    urgente: false,
    justificativa: base && base.justificativa ? base.justificativa : '',
    modo: base && base.modo === 'LEVA_BUSCA' ? 'LEVA_BUSCA' : 'ACOMPANHA',
  }));
  const [disp, setDisp] = useState(null);
  const [aberto, setAberto] = useState(null);
  const [tentou, setTentou] = useState(false);
  const [enviando, setEnviando] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const leva = admin && f.modo === 'LEVA_BUSCA';

  useEffect(() => {
    if (!f.data) return;
    let vivo = true; setDisp(null);
    api('disponibilidade', { inicio: f.data, fim: f.data }).then(r => vivo && setDisp(r)).catch(e => { if (vivo) { aviso('erro', e.message); setDisp({ eventos: [], veiculos: [] }); } });
    return () => { vivo = false; };
  }, [f.data]);

  const horasOk = f.horaIda && f.horaRetorno && f.horaRetorno > f.horaIda;
  const bls = horasOk ? blocos({ ...f, modo: leva ? 'LEVA_BUSCA' : 'ACOMPANHA' }) : [];
  const ign = editando ? editando.id : '';
  const conf = disp && horasOk ? conflitoBlocos(disp.eventos, disp.veiculos, f.data, bls, ign) : null;
  const capac = disp ? Math.max(1, disp.veiculos.length) : 1;
  const eventosVis = disp ? disp.eventos.filter(e => !(editando && e.solicitacaoId === editando.id)) : [];
  const viagensDoDia = eventosVis.filter(e => e.info && !e.meu && AGENDADA(e.info) && e.info.vagas !== 0);
  const pass = f.passageiros.split('\n').map(x => x.trim()).filter(Boolean);
  const erros = {
    data: !f.data ? 'Escolha a data.' : f.data < hojeStr() ? 'Essa data já passou.' : '',
    horaIda: !f.horaIda ? 'Informe a saída.' : '',
    horaRetorno: !f.horaRetorno ? (leva ? 'Informe a busca.' : 'Informe o retorno.') : (f.horaIda && f.horaRetorno <= f.horaIda) ? 'Precisa ser depois da saída.' : '',
    destino: !f.destino.trim() ? 'Informe o local.' : '',
    passageiros: !pass.length ? 'Informe pelo menos uma pessoa.' : '',
    urgente: !admin && conf && conf.conflito && !f.urgente ? 'Horário ocupado.' : '',
    justificativa: !admin && conf && conf.conflito && f.urgente && !f.justificativa.trim() ? 'Explique a urgência.' : '',
    veiculo: admin && disp && disp.veiculos.length && !ad.veiculoId ? 'Escolha o veículo.' : '',
    motorista: admin && ad.modoMot === 'agora' && !ad.motorista.trim() ? 'Informe quem vai dirigir.' : '',
  };
  const veicSel = admin && disp ? disp.veiculos.find(v => v.id === ad.veiculoId) : null;
  const veicOcupado = !!(veicSel && conf && conf.placasOcupadas.includes(veicSel.placa));
  const escolherVeiculo = v => setAd({ ...ad, veiculoId: v.id, motorista: ad.modoMot === 'agora' && (!ad.motorista || (veicSel && ad.motorista === veicSel.motorista)) ? (v.motorista || '') : ad.motorista });
  const nomesMot = [...new Set([...mots.map(m => m.nome), ...(disp ? disp.veiculos.map(v => v.motorista) : [])].filter(Boolean))];
  const temErro = Object.values(erros).some(Boolean);
  const mostra = k => tentou && erros[k] ? <span className="erro-campo">{erros[k]}</span> : null;
  const cls = k => tentou && erros[k] ? 'invalido' : '';
  const mudaDia = n => setF({ ...f, data: ymd(addDias(parseYmd(f.data || hojeStr()), n)) });

  const enviar = async e => {
    e.preventDefault(); setTentou(true);
    if (temErro) { aviso('erro', erros.urgente ? 'Esse horário está ocupado. Escolha outro, peça encaixe numa viagem ou marque "Solicitar mesmo assim".' : erros.veiculo || erros.motorista || 'Confira os campos destacados em vermelho.'); return; }
    if (admin && veicOcupado && !confirm(`O veículo ${veicSel.placa} já tem agendamento nesse horário. Agendar mesmo assim?`)) return;
    setEnviando(true);
    try {
      if (admin) {
        const depois = ad.modoMot === 'depois';
        const r = await api('agendarDireto', {
          data: f.data, horaIda: f.horaIda, horaRetorno: f.horaRetorno, destino: f.destino, passageiros: pass, finalidade: f.finalidade,
          modo: leva ? 'LEVA_BUSCA' : 'ACOMPANHA', solicitante: ad.solicitante, setor: ad.setor,
          veiculoId: ad.veiculoId, motorista: depois ? '' : ad.motorista, definirDepois: depois, obs: ad.obs, forcar: veicOcupado,
        });
        aviso('ok', depois ? `Agendamento #${r.id} pré-agendado. Defina o motorista perto da data.` : `Agendamento #${r.id} confirmado e colocado no Google Agenda.`);
        concluir(r); return;
      }
      const dados = { ...f, passageiros: pass, urgente: !!(conf && conf.conflito && f.urgente) };
      const r = editando ? await api('alterarSolicitacao', { id: editando.id, ...dados }) : await api('criarSolicitacao', dados);
      aviso('ok', editando
        ? (editando.status === 'PENDENTE' ? `Solicitação #${r.id} atualizada.` : `Pedido de alteração da #${r.id} enviado. Até a aprovação, vale o agendamento atual.`)
        : `Solicitação #${r.id} enviada. Você vai receber um e-mail quando ela for analisada.`);
      concluir(r);
    } catch (err) { aviso('erro', err.message); }
    finally { setEnviando(false); }
  };

  return (
    <form onSubmit={enviar} noValidate>
      <div className="cab">
        <div>
          <h1>{admin ? 'Agendar um carro' : editando ? (editando.status === 'PENDENTE' ? `Editar solicitação #${editando.id}` : `Pedir alteração da #${editando.id}`) : 'Pedir um carro'}</h1>
          <p>{admin ? 'O agendamento já entra confirmado (ou pré-agendado) e vai direto para o Google Agenda.' : editando && editando.status !== 'PENDENTE' ? 'O agendamento atual continua valendo até a nova versão ser aprovada.' : 'Todos os campos marcados são obrigatórios.'}</p>
        </div>
      </div>

      {admin && <div className="painel">
        <h2>Como vai ser a viagem</h2>
        <div className="op-modos" role="radiogroup" aria-label="Tipo de viagem">
          <button type="button" role="radio" aria-checked={!leva} className={'op-modo' + (!leva ? ' sel' : '')} onClick={() => setF({ ...f, modo: 'ACOMPANHA' })}>
            <b>Motorista acompanha</b><span>O carro fica com a pessoa da saída até a volta.</span>
          </button>
          <button type="button" role="radio" aria-checked={leva} className={'op-modo' + (leva ? ' sel' : '')} onClick={() => setF({ ...f, modo: 'LEVA_BUSCA' })}>
            <b>Só leva e busca</b><span>O motorista deixa, atende outras pessoas e volta para buscar.</span>
          </button>
        </div>
      </div>}

      <div className="painel">
        <h2>Quando</h2>
        <div className="campo">
          <label htmlFor="fd">Data</label>
          <div style={{ display: 'flex', gap: 8 }}>
            <button type="button" className="btn contorno" style={{ padding: '0 12px' }} onClick={() => mudaDia(-1)} aria-label="Dia anterior">{I.esq}</button>
            <input id="fd" type="date" min={hojeStr()} value={f.data} onChange={set('data')} className={cls('data')} />
            <button type="button" className="btn contorno" style={{ padding: '0 12px' }} onClick={() => mudaDia(1)} aria-label="Próximo dia">{I.dir}</button>
          </div>
          {f.data && <span className="dica">{cap(fmtLonga(f.data))}</span>}
          {mostra('data')}
        </div>

        {!disp ? <Carregando txt="Consultando a agenda…" /> : (
          <>
            <Regua data={f.data} eventos={eventosVis} capacidade={capac} janelas={bls} conflito={conf && conf.conflito} onBloco={setAberto} />
            <Legenda capacidade={capac} />
            {viagensDoDia.length > 0 && (
              <div className="dia-itens" style={{ marginTop: 12 }}>
                <p className="dica" style={{ margin: 0, color: 'var(--muted)', fontSize: '.84rem' }}>Viagens deste dia (toque para ver ou pedir encaixe):</p>
                {segmentos(viagensDoDia, f.data).map((s, i) => <ItemAgenda key={i} ev={s.ev} onClick={() => setAberto(s.ev)} />)}
              </div>
            )}
          </>
        )}

        <div className="linha2" style={{ marginTop: 18 }}>
          <div className="campo"><label htmlFor="hi">{leva ? 'Levar às' : 'Saída'}</label><input id="hi" type="time" value={f.horaIda} onChange={set('horaIda')} className={cls('horaIda')} />{mostra('horaIda')}</div>
          <div className="campo"><label htmlFor="hr">{leva ? 'Buscar às' : 'Retorno'}</label><input id="hr" type="time" value={f.horaRetorno} onChange={set('horaRetorno')} className={cls('horaRetorno')} />{mostra('horaRetorno')}</div>
        </div>
        {leva && horasOk && <p className="dica" style={{ marginTop: -6, color: 'var(--muted)' }}>{bls.length > 1
          ? `O carro fica reservado das ${hm(bls[0].a)} às ${hm(bls[0].b)} (levar) e das ${hm(bls[1].a)} às ${hm(bls[1].b)} (buscar). No meio, fica livre.`
          : 'A busca é logo depois da ida, então o carro fica reservado o tempo todo.'}</p>}

        {!horasOk ? <div className="disp neutro">Preencha os horários para ver se há carro livre.</div>
          : !conf ? null
            : !conf.conflito ? (
              <div className="disp livre" role="status">
                <span>Horário livre<small>{conf.capacidade - conf.ocupados} de {conf.capacidade} veículo(s) disponível(is){leva && bls.length > 1 ? ' na ida e na busca' : ' nesse intervalo'}.</small></span>
              </div>
            ) : (
              admin ? (
                <div className="disp ocupado" role="alert"><span>Todos os veículos têm agendamento nesse horário<small>Você ainda pode agendar: escolha o veículo abaixo e confirme.</small></span></div>
              ) : <>
                <div className="disp ocupado" role="alert">
                  <span>Horário indisponível<small>Todos os {conf.capacidade} veículo(s) já estão agendados {leva && bls.length > 1 ? 'na ida ou na busca' : `em algum momento entre ${f.horaIda} e ${f.horaRetorno}`}.{viagensDoDia.length ? ' Veja se alguma viagem deste dia vai para perto e peça encaixe.' : ''}</small></span>
                </div>
                <div className="urgente-box">
                  <label className="check"><input type="checkbox" checked={f.urgente} onChange={set('urgente')} />Solicitar mesmo assim (urgente)</label>
                  <p>O pedido vai para a administração marcado como urgente, que decide se remaneja outro agendamento.</p>
                  {f.urgente && (
                    <div className="campo" style={{ marginBottom: 0 }}>
                      <label htmlFor="ju">Por que é urgente?</label>
                      <textarea id="ju" value={f.justificativa} onChange={set('justificativa')} className={cls('justificativa')} />
                      {mostra('justificativa')}
                    </div>
                  )}
                  {mostra('urgente')}
                </div>
              </>
            )}
      </div>

      {admin && (
        <div className="painel">
          <h2>Para quem</h2>
          <div className="linha2">
            <div className="campo"><label htmlFor="as">Solicitante</label><input id="as" type="text" value={ad.solicitante} onChange={e => setAd({ ...ad, solicitante: e.target.value })} /></div>
            <div className="campo"><label htmlFor="ast">Setor <span className="dica">(opcional)</span></label><input id="ast" type="text" value={ad.setor} onChange={e => setAd({ ...ad, setor: e.target.value })} placeholder={usuario ? usuario.setor : ''} /></div>
          </div>
        </div>
      )}

      <div className="painel">
        <h2>Para onde</h2>
        <div className="campo"><label htmlFor="de">Local de destino</label><input id="de" type="text" placeholder="Ex.: EMEF Jabaquara" value={f.destino} onChange={set('destino')} className={cls('destino')} />{mostra('destino')}</div>
        <div className="campo" style={{ marginBottom: 0 }}><label htmlFor="fi">Finalidade <span className="dica">(opcional)</span></label><input id="fi" type="text" placeholder="Ex.: formação de professores" value={f.finalidade} onChange={set('finalidade')} /></div>

      <div className="painel">
        <h2>Quem vai</h2>
        <div className="campo" style={{ marginBottom: 0 }}>
          <label htmlFor="pa">Passageiros <span className="dica">um nome por linha, incluindo você se for</span></label>
          <textarea id="pa" value={f.passageiros} onChange={set('passageiros')} className={cls('passageiros')} placeholder={'Maria Souza\nTiago Reis'} />
          {pass.length > 0 && <span className="dica">{pass.length} {pass.length === 1 ? 'pessoa' : 'pessoas'}</span>}
          {mostra('passageiros')}
        </div>
      </div>

      {admin && disp && (
        <div className="painel">
          <h2>Veículo</h2>
          {disp.veiculos.length === 0 ? <p className="nota obs" style={{ marginTop: 0 }}>Nenhum veículo cadastrado.</p> : (
            <div className="veics" role="radiogroup" aria-label="Veículo">
              {disp.veiculos.map(v => {
                const ocup = conf && conf.placasOcupadas.includes(v.placa);
                const bq = bloqueioDe(disp.bloqueios, { veiculoId: v.id }, f.data, bls);
                return (
                  <button key={v.id} type="button" role="radio" disabled={!!bq} aria-checked={ad.veiculoId === v.id} className={'veic-op' + (ad.veiculoId === v.id ? ' sel' : '') + (bq ? ' bloq' : '')} onClick={() => escolherVeiculo(v)}>
                    <span className="placa">{v.placa}</span>
                    <span className="mod">{v.modelo || 'Veículo'}<small>{bq ? `${bq.motivo}, até ${fimBloq(bq)}` : [v.lugares ? `${v.lugares} lugares` : '', v.motorista ? `motorista fixo ${v.motorista}` : 'sem motorista fixo'].filter(Boolean).join(', ')}</small></span>
                    {conf && <span className={'veic-st ' + (bq || ocup ? 'ocup' : 'livre')}>{bq ? 'Bloqueado' : ocup ? 'Ocupado' : 'Livre'}</span>}
                  </button>

          {mostra('veiculo')}
          <h2 style={{ marginTop: 20 }}>Motorista</h2>
          <div className="seg" style={{ marginBottom: 12 }} role="tablist">
            <button type="button" role="tab" aria-selected={ad.modoMot === 'agora'} className={ad.modoMot === 'agora' ? 'ativo' : ''} onClick={() => setAd({ ...ad, modoMot: 'agora', motorista: ad.motorista || (veicSel && veicSel.motorista) || '' })}>Definir agora</button>
            <button type="button" role="tab" aria-selected={ad.modoMot === 'depois'} className={ad.modoMot === 'depois' ? 'ativo' : ''} onClick={() => setAd({ ...ad, modoMot: 'depois' })}>Definir depois (pré-agendar)</button>
          </div>
          {ad.modoMot === 'depois' ? <p className="nota pre" style={{ marginTop: 0 }}><b>O carro fica reservado</b>Você recebe o lembrete por e-mail quando a data estiver chegando.</p> : (<>
            {horasOk && <PainelMotoristas nomes={nomesMot} todas={todas} bloqueios={disp.bloqueios} solId="" data={f.data} alvo={bls} valor={ad.motorista} fixo={veicSel && veicSel.motorista} escolher={n => setAd({ ...ad, motorista: n })} />}
            <div className="campo" style={{ marginTop: 12 }}>
              <label htmlFor="amo">Quem vai dirigir</label>
              <span className="dica">Toque num motorista acima ou digite o nome de quem vai dirigir (ex.: a própria servidora).</span>
              <input id="amo" type="text" value={ad.motorista} onChange={e => setAd({ ...ad, motorista: e.target.value })} className={cls('motorista')} />
              {mostra('motorista')}
            </div>
          </>)}
          <div className="campo" style={{ marginBottom: 0 }}><label htmlFor="aob">Observação <span className="dica">(opcional)</span></label><input id="aob" type="text" value={ad.obs} onChange={e => setAd({ ...ad, obs: e.target.value })} /></div>
        </div>
      )}

      <div className="fixo-rodape acoes-fim">
        {cancelar && <button type="button" className="btn contorno" onClick={cancelar}>Voltar</button>}
        <button className="btn prim" style={{ flex: 1, maxWidth: 360 }} disabled={enviando}>
          {enviando ? 'Enviando…' : admin ? (ad.modoMot === 'depois' ? 'Pré-agendar' : 'Agendar') : editando ? (editando.status === 'PENDENTE' ? 'Salvar solicitação' : 'Enviar pedido de alteração') : 'Enviar solicitação'}
        </button>
      </div>
      {aberto && <ViagemModal ev={aberto} fechar={() => setAberto(null)} pedirEncaixe={pedirEncaixe} />}

function FormEncaixe({ viagem, concluir, cancelar }) {
  const aviso = useAviso();
  const [destino, setDestino] = useState('');
  const [passageiros, setPassageiros] = useState('');
  const [obs, setObs] = useState('');
  const [tentou, setTentou] = useState(false);
  const [enviando, setEnviando] = useState(false);
  const v = viagem;
  const pass = passageiros.split('\n').map(x => x.trim()).filter(Boolean);
  const semLugar = v.vagas !== null && pass.length > v.vagas;
  const enviar = async e => {
    e.preventDefault(); setTentou(true);
    if (!destino.trim() || !pass.length) { aviso('erro', 'Informe para onde você vai e quem vai no encaixe.'); return; }
    setEnviando(true);
    try {
      const r = await api('criarSolicitacao', { tipo: 'ENCAIXE', encaixeDe: v.id, destino, passageiros: pass, finalidade: obs });
      aviso('ok', `Pedido de encaixe #${r.id} enviado. Você recebe um e-mail com a resposta.`);
      concluir(r);
    } catch (err) { aviso('erro', err.message); } finally { setEnviando(false); }
  };
  return (
    <form onSubmit={enviar} noValidate>
      <div className="cab"><div><h1>Pedir encaixe</h1><p>Você vai junto numa viagem que já está marcada, no mesmo carro e horário.</p></div></div>
      <div className="painel encaixe-base">
        <div className="sol-topo"><span className={'pill ' + v.status}>{STATUS[v.status]}</span>{v.modo === 'LEVA_BUSCA' && <span className="pill neutro">Leva e busca</span>}<span className="sol-id">Viagem #{v.id}</span></div>
        <h2 style={{ margin: '6px 0 8px' }}>{v.destino}</h2>
        <dl className="dl">
          <dt>Data</dt><dd>{cap(fmtLonga(v.data))}</dd>
          <dt>Horário</dt><dd>{textoHorario(v)}</dd>
          <dt>De</dt><dd>{v.solicitante}{v.setor ? `, ${v.setor}` : ''}</dd>
          <dt>Veículo</dt><dd>{v.placa}{v.modelo ? ` (${v.modelo})` : ''}, motorista {v.motorista || 'a definir'}</dd>
          {v.vagas !== null && <><dt>Lugares livres</dt><dd>{v.vagas}</dd></>}
        </dl>
      </div>
      <div className="painel">
        <div className="campo">
          <label htmlFor="ed">Para onde você vai</label>
          <span className="dica">Se for o mesmo lugar, repita o destino da viagem.</span>
          <input id="ed" type="text" value={destino} onChange={e => setDestino(e.target.value)} placeholder={v.destino} className={tentou && !destino.trim() ? 'invalido' : ''} />
        </div>
        <div className="campo">
          <label htmlFor="ep">Quem vai no encaixe <span className="dica">um nome por linha</span></label>
          <textarea id="ep" value={passageiros} onChange={e => setPassageiros(e.target.value)} className={tentou && !pass.length ? 'invalido' : ''} />
          {semLugar && <span className="erro-campo">A viagem tem {v.vagas} lugar(es) livre(s). A administração vai avaliar.</span>}
        </div>
        <div className="campo" style={{ marginBottom: 0 }}>
          <label htmlFor="eo">Observação para a administração <span className="dica">(opcional)</span></label>
          <textarea id="eo" value={obs} onChange={e => setObs(e.target.value)} placeholder="Ex.: fico a duas quadras e volto junto na busca." />
        </div>
      </div>
      <div className="fixo-rodape acoes-fim">
        <button type="button" className="btn contorno" onClick={cancelar}>Voltar</button>
        <button className="btn prim" style={{ flex: 1, maxWidth: 360 }} disabled={enviando}>{enviando ? 'Enviando…' : 'Enviar pedido de encaixe'}</button>
      </div>
    </form>
  );
}

/* ============================ meus pedidos ============================ */
function Minhas({ editar, novo }) {
  const aviso = useAviso();
  const [lista, setLista] = useState(null);
  const [cancelando, setCancelando] = useState(null);
  const carregar = async () => { try { setLista(await api('minhasSolicitacoes')); } catch (e) { aviso('erro', e.message); setLista([]); } };
  useEffect(() => { carregar(); }, []);
  if (!lista) return <Carregando />;
  const proximas = lista.filter(s => ativa(s) && futura(s)).sort((a, b) => (a.data + a.horaIda).localeCompare(b.data + b.horaIda));
  const outras = lista.filter(s => !proximas.includes(s));

  const cartao = s => (
    <SolCard key={s.id} s={s}>
      {ativa(s) && futura(s) && (
        <div className="sol-acoes">
          {s.tipo !== 'ENCAIXE' && <button className="btn contorno pequeno" onClick={() => editar(s)}>{s.status === 'PENDENTE' ? 'Editar' : 'Pedir alteração'}</button>}
          <button className="btn perigo pequeno" onClick={() => setCancelando(s)}>Cancelar</button>
        </div>
      )}
      <Historico itens={s.historico} />
    </SolCard>
  );

  return (
    <>
      <div className="cab"><div><h1>Meus pedidos</h1><p>Cada mudança de situação também chega no seu e-mail.</p></div></div>
      {lista.length === 0 ? (
        <div className="painel vazio"><b>Você ainda não pediu nenhum carro</b>Quando fizer um pedido, ele aparece aqui com a situação atualizada.<div style={{ marginTop: 16 }}><button className="btn prim" onClick={novo}>Pedir um carro</button></div></div>
      ) : (<>
        {proximas.length > 0 && <><h2 className="grupo-tit">Próximos</h2><div className="lista">{proximas.map(cartao)}</div></>}
        {outras.length > 0 && <><h2 className="grupo-tit">Anteriores e encerrados</h2><div className="lista">{outras.map(cartao)}</div></>}
      </>)}
      {cancelando && (
        <PerguntaModal titulo={`Cancelar o pedido #${cancelando.id}?`} perigo botao="Cancelar pedido"
          texto={cancelando.status === 'PENDENTE' ? 'O pedido sai da fila da administração.' : cancelando.tipo === 'ENCAIXE' ? 'Você sai desta viagem.' : 'O agendamento sai do Google Agenda e o carro fica livre para outra pessoa. Encaixes nesta viagem também são cancelados.'}
          rotulo="Motivo (opcional)" fechar={() => setCancelando(null)}
          confirmar={async motivo => {
            try { await api('cancelarSolicitacao', { id: cancelando.id, motivo }); aviso('ok', `Pedido #${cancelando.id} cancelado.`); setCancelando(null); carregar(); }
            catch (e) { aviso('erro', e.message); }
          }} />
      )}
    </>
  );
}
/* ============================ administração: pedidos ============================ */
const FILTROS = [
  ['aguardando', 'Aguardando', s => ['PENDENTE', 'ALTERACAO_PENDENTE'].includes(s.status)],
  ['semmotorista', 'Sem motorista', s => s.status === 'PRE_AGENDADA' && s.tipo !== 'ENCAIXE' && futura(s)],
  ['confirmados', 'Confirmados futuros', s => s.status === 'APROVADA' && futura(s)],
  ['recusadas', 'Recusados', s => s.status === 'RECUSADA'],
  ['canceladas', 'Cancelados', s => s.status === 'CANCELADA'],
  ['todas', 'Todos', () => true],
];
const contarAlertas = l => l.filter(FILTROS[0][2]).length + l.filter(preProximo).length;

function Pedidos({ abrirSol, versao, setPendentes, agendar }) {
  const aviso = useAviso();
  const [lista, setLista] = useState(null);
  const [filtro, setFiltro] = useState('aguardando');
  const [busca, setBusca] = useState('');
  useEffect(() => {
    api('listarSolicitacoes').then(l => { setLista(l); setPendentes(contarAlertas(l)); })
      .catch(e => { aviso('erro', e.message); setLista([]); });
  }, [versao]);
  if (!lista) return <Carregando />;
  const fn = FILTROS.find(f => f[0] === filtro)[2];
  const q = busca.trim().toLowerCase();
  let vis = lista.filter(fn).filter(s => !q || [s.id, s.solicitante, s.destino, s.setor, s.placa, s.motorista].join(' ').toLowerCase().includes(q));
  if (['aguardando', 'semmotorista', 'confirmados'].includes(filtro)) {
    vis = vis.sort((a, b) => (b.urgente - a.urgente) || ((a.proposta || a).data + (a.proposta || a).horaIda).localeCompare((b.proposta || b).data + (b.proposta || b).horaIda));
  }
  const preUrg = lista.filter(preProximo);
  return (
    <>
      <div className="cab"><div><h1>Pedidos</h1><p>Toque em um pedido para aprovar, pré-agendar, definir motorista ou ajustar.</p></div><button className="btn prim" onClick={agendar}>+ Agendar carro</button></div>
      {preUrg.length > 0 && filtro !== 'semmotorista' && (
        <div className="alerta-pre">
          <span><b>{preUrg.length} pré-agendamento(s) sem motorista</b> nos próximos {DIAS_ALERTA} dias{preUrg.some(s => diasAte(s.data) <= 1) ? ', incluindo hoje ou amanhã' : ''}.</span>
          <button className="btn pequeno contorno" onClick={() => setFiltro('semmotorista')}>Definir motoristas</button>
        </div>
      )}
      <div className="filtros" role="tablist">
        {FILTROS.map(([k, rot, f]) => (
          <button key={k} role="tab" aria-selected={filtro === k} className={filtro === k ? 'ativo' : ''} onClick={() => setFiltro(k)}>
            {rot}{k !== 'todas' && <span className="badge" style={filtro === k ? null : { background: 'var(--slate-w)', color: 'var(--muted)' }}>{lista.filter(f).length}</span>}
          </button>
        ))}
      </div>
      <div className="campo"><input type="text" placeholder="Buscar por nome, destino, setor, placa, motorista ou número" value={busca} onChange={e => setBusca(e.target.value)} aria-label="Buscar pedidos" /></div>
      {vis.length === 0
        ? <div className="painel vazio"><b>{filtro === 'aguardando' ? 'Nenhum pedido aguardando' : filtro === 'semmotorista' ? 'Todos os pré-agendamentos já têm motorista' : 'Nada por aqui'}</b>{filtro === 'aguardando' ? 'Os novos pedidos aparecem aqui e também chegam no seu e-mail.' : 'Tente outro filtro.'}</div>
        : <div className="lista">{vis.map(s => <SolCard key={s.id} s={s} admin onClick={() => abrirSol(s.id)} />)}</div>}
    </>
  );
}

/* Carga de trabalho dos motoristas para escolher quem dirige */
function PainelMotoristas({ nomes, todas, bloqueios, solId, data, alvo, valor, fixo, escolher }) {
  const ini = segundaDaSemana(parseYmd(data)), fimSem = ymd(addDias(ini, 6)), iniSem = ymd(ini);
  const conta = x => x.id !== solId && x.tipo !== 'ENCAIXE' && ['APROVADA', 'ALTERACAO_PENDENTE'].includes(x.status);
  const linhas = nomes.map(nome => {
    const doMot = todas.filter(x => conta(x) && (x.motorista || '').trim().toLowerCase() === nome.toLowerCase());
    const dia = doMot.filter(x => x.data === data);
    const sem = doMot.filter(x => x.data >= iniSem && x.data <= fimSem);
    const choque = dia.filter(x => blocos(x).some(b => alvo.some(a => b.a < a.b && b.b > a.a)));
    return { nome, dia, sem, choque, bq: bloqueioDe(bloqueios, { motorista: nome }, data, alvo), hDia: dia.reduce((t, x) => t + horasDe(x), 0), hSem: sem.reduce((t, x) => t + horasDe(x), 0) };
  });
  if (!linhas.length) return <p className="nota obs" style={{ marginTop: 0 }}>Cadastre os motoristas em Cadastros para ver a agenda de cada um aqui.</p>;
  return (
    <div className="veics" role="radiogroup" aria-label="Motorista">
      {linhas.map(l => (
        <button key={l.nome} type="button" role="radio" disabled={!!l.bq} aria-checked={valor === l.nome} className={'veic-op mot' + (valor === l.nome ? ' sel' : '') + (l.bq ? ' bloq' : '')} onClick={() => escolher(l.nome)}>
          <span className="mod">
            <b style={{ fontWeight: 700 }}>{l.nome}</b>{fixo === l.nome && <em className="tag-fixo">fixo deste carro</em>}
            <small>Neste dia: {plural(l.dia.length, 'viagem', 'viagens')}{l.dia.length ? `, ${fmtH(l.hDia)}` : ''}. Semana: {plural(l.sem.length, 'viagem', 'viagens')}{l.sem.length ? `, ${fmtH(l.hSem)}` : ''}.</small>
            {l.bq && <small className="choque">Indisponível: {l.bq.motivo}, até {fimBloq(l.bq)}</small>}
            {l.choque.length > 0 && <small className="choque">Ocupado: {l.choque.map(x => `${textoHorario(x)}, ${x.destino} (#${x.id})`).join('; ')}</small>}
          </span>
          <span className={'veic-st ' + (l.bq || l.choque.length ? 'ocup' : 'livre')}>{l.bq ? 'Bloqueado' : l.choque.length ? 'Ocupado' : 'Livre'}</span>
        </button>
      ))}
    </div>
  );
}

const telWhats = t => { const d = String(t || '').replace(/\D/g, ''); return d.length >= 12 ? d : d ? '55' + d : ''; };

function DetalheAdmin({ id, fechar, mudou }) {
  const aviso = useAviso();
  const [s, setS] = useState(null);
  const [todas, setTodas] = useState([]);
  const [mots, setMots] = useState([]);
  const [disp, setDisp] = useState(null);
  const [veiculoId, setVeiculoId] = useState('');
  const [modoMot, setModoMot] = useState('depois');
  const [motorista, setMotorista] = useState('');
  const [horaLevar, setHoraLevar] = useState('');
  const [horaBuscar, setHoraBuscar] = useState('');
  const [modoViagem, setModoViagem] = useState('ACOMPANHA');
  const [obs, setObs] = useState('');
  const [modo, setModo] = useState(null);
  const [enviando, setEnviando] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const [lista, ms] = await Promise.all([api('listarSolicitacoes'), api('motoristas').catch(() => [])]);
        const sol = lista.find(x => x.id === id);
        if (!sol) { aviso('erro', 'Solicitação não encontrada.'); fechar(); return; }
        setS(sol); setTodas(lista); setMots(ms.filter(m => m.ativo));
        setObs(sol.obsAdmin && AGENDADA(sol) ? sol.obsAdmin : '');
        const ef = sol.proposta || sol;
        setHoraLevar(ef.horaIda); setHoraBuscar(ef.horaRetorno);
        setModoViagem(ef.modo === 'LEVA_BUSCA' ? 'LEVA_BUSCA' : 'ACOMPANHA');
        const d = await api('disponibilidade', { inicio: ef.data, fim: ef.data });
        setDisp(d);
        if (sol.tipo === 'ENCAIXE') return;
        const bl = blocos(ef);
        const c = conflitoBlocos(d.eventos, d.veiculos, ef.data, bl, sol.id);
        const livre = d.veiculos.find(v => !c.placasOcupadas.includes(v.placa) && (!v.lugares || v.lugares > sol.passageiros.length));
        const vId = sol.veiculoId || (livre ? livre.id : '');
        const vObj = d.veiculos.find(v => v.id === vId);
        setVeiculoId(vId);
        const agora = ['APROVADA', 'PRE_AGENDADA'].includes(sol.status) || (sol.status === 'ALTERACAO_PENDENTE' && !!sol.motorista);
        setModoMot(agora ? 'agora' : 'depois');
        setMotorista(sol.motorista || (vObj && vObj.motorista) || '');
      } catch (e) { aviso('erro', e.message); fechar(); }
    })();
  }, [id]);

  if (!s) return <Modal titulo={`Solicitação #${id}`} fechar={fechar}><Carregando /></Modal>;
  const encaixe = s.tipo === 'ENCAIXE';
  const ef = { ...(s.proposta || s) };
  if (s.tipo !== 'ENCAIXE') { ef.modo = modoViagem; if (modoViagem === 'LEVA_BUSCA' && horaLevar && horaBuscar > horaLevar) { ef.horaIda = horaLevar; ef.horaRetorno = horaBuscar; } }
  const bl = blocos(ef);
  const pendente = ['PENDENTE', 'ALTERACAO_PENDENTE'].includes(s.status);
  const conf = disp ? conflitoBlocos(disp.eventos, disp.veiculos, ef.data, bl, s.id) : null;
  const eventosVis = disp ? disp.eventos.filter(e => e.solicitacaoId !== s.id) : [];
  const vs = disp ? disp.veiculos.find(v => v.id === veiculoId) : null;
  const base = encaixe ? todas.find(x => x.id === s.encaixeDe) : null;
  const baseInfo = encaixe && disp ? (disp.eventos.find(e => e.solicitacaoId === s.encaixeDe) || {}).info : null;
  const nomes = [...new Set([...mots.map(m => m.nome), ...(disp ? disp.veiculos.map(v => v.motorista) : [])].filter(Boolean))];
  const motCad = mots.find(m => m.nome === s.motorista);
  const encaixesDaViagem = todas.filter(x => x.tipo === 'ENCAIXE' && x.encaixeDe === s.id && ['PENDENTE', 'PRE_AGENDADA', 'APROVADA'].includes(x.status));

  const acao = async (nome, dados, msg) => {
    setEnviando(true);
    try { await api(nome, { id: s.id, ...dados }); aviso('ok', msg); mudou(); fechar(); }
    catch (e) { aviso('erro', e.message); }
    finally { setEnviando(false); }
  };
  const escolherVeiculo = v => {
    setVeiculoId(v.id);
    if (modoMot === 'agora') setMotorista(v.id === s.veiculoId && s.motorista ? s.motorista : (v.motorista || ''));
  };
  const trocarModoMot = m => {
    setModoMot(m);
    if (m === 'agora' && !motorista && vs && vs.motorista) setMotorista(vs.motorista);
  };
  const aprovar = () => {
    if (encaixe) return acao('aprovar', { obs }, `Encaixe #${s.id} aprovado.`);
    if (disp && disp.veiculos.length && !veiculoId) return aviso('erro', 'Escolha o veículo.');
    if (modoMot === 'agora' && !motorista.trim()) return aviso('erro', 'Escolha quem vai dirigir ou marque "Definir depois".');
    const depois = modoMot === 'depois';
    if (modoViagem === 'LEVA_BUSCA' && !(horaLevar && horaBuscar && horaBuscar > horaLevar)) return aviso('erro', 'Informe a hora de levar e a hora de buscar (depois da de levar).');
    acao('aprovar', { veiculoId, motorista: depois ? '' : motorista, definirDepois: depois, modo: modoViagem, horaLevar, horaBuscar, obs },
      depois ? `Pedido #${s.id} pré-agendado. O carro está reservado; defina o motorista perto da data.`
        : s.status === 'PRE_AGENDADA' ? `Motorista definido. Pedido #${s.id} confirmado.` : `Pedido #${s.id} confirmado e colocado no Google Agenda.`);
  };
  const msgMotorista = () => [
    `Olá, ${s.motorista.split(' ')[0]}! Viagem confirmada:`,
    `📅 ${cap(fmtLonga(s.data))}`,
    `🕗 ${textoHorario(s)}`,
    `🚗 ${s.placa}`,
    `📍 ${s.destino}`,
    `👥 ${s.passageiros.join(', ')}`,
    `🙋 ${s.solicitante}${s.setor ? ` (${s.setor})` : ''}`,
    ...encaixesDaViagem.filter(AGENDADA).map(x => `➕ Encaixe: ${x.solicitante} → ${x.destino} (${x.passageiros.join(', ')})`),
    ...(s.obsAdmin ? [`📝 ${s.obsAdmin}`] : []),
  ].join('\n');

  const rotAprovar = encaixe ? 'Aprovar encaixe'
    : modoMot === 'depois' ? (s.status === 'PRE_AGENDADA' ? 'Salvar' : 'Pré-agendar')
      : s.status === 'PRE_AGENDADA' ? 'Confirmar com motorista'
        : s.status === 'APROVADA' ? 'Salvar mudanças' : 'Confirmar agendamento';

  return (
    <Modal titulo={`${encaixe ? 'Encaixe' : 'Solicitação'} #${s.id}`} fechar={fechar}>
      <div className="sol-topo" style={{ marginBottom: 14 }}>
        <span className={'pill ' + s.status}>{STATUS[s.status]}</span>
        {ef.modo === 'LEVA_BUSCA' && <span className="pill neutro">Leva e busca</span>}
        {(s.urgente || (s.proposta && s.proposta.urgente)) && <span className="pill urg">Urgente</span>}
      </div>

      <div className="painel">
        <dl className="dl">
          <dt>Solicitante</dt><dd>{s.solicitante}{s.setor ? `, ${s.setor}` : ''}<br /><a href={`mailto:${s.email}`} style={{ color: 'var(--pine)', fontWeight: 400, fontSize: '.86rem' }}>{s.email}</a></dd>
          <dt>Data</dt><dd>{cap(fmtLonga(ef.data))}</dd>
          <dt>Horário</dt><dd>{textoHorario(ef)}</dd>
          <dt>Destino</dt><dd>{ef.destino}</dd>
          <dt>Passageiros</dt><dd>{ef.passageiros.join(', ')} ({ef.passageiros.length})</dd>
          {ef.finalidade && <><dt>{encaixe ? 'Observação' : 'Finalidade'}</dt><dd>{ef.finalidade}</dd></>}
        </dl>
        {s.proposta && (
          <div style={{ marginTop: 14 }}>
            <p style={{ margin: '0 0 8px', fontWeight: 600 }}>O que muda</p>
            <div className="antes-depois">
              <div className="antes">{fmtCurta(s.data)}, {textoHorario(s)}<br />{s.destino}</div>
              <div className="depois">{fmtCurta(s.proposta.data)}, {textoHorario(s.proposta)}<br />{s.proposta.destino}</div>
            </div>
          </div>
        )}
        {(s.proposta ? s.proposta.justificativa : s.justificativa) &&
          <div className="nota alt"><b>Justificativa da urgência</b>{s.proposta ? s.proposta.justificativa : s.justificativa}</div>}
      </div>

      {encaixe && (
        <div className="painel encaixe-base">
          <h2>Viagem principal #{s.encaixeDe}</h2>
          {!base ? <p className="nota obs" style={{ marginTop: 0 }}>A viagem principal não foi encontrada.</p> : (<>
            <dl className="dl">
              <dt>De</dt><dd>{base.solicitante}</dd>
              <dt>Destino</dt><dd>{base.destino}</dd>
              <dt>Situação</dt><dd>{STATUS[base.status]}</dd>
              <dt>Veículo</dt><dd>{base.placa || '—'}, motorista {base.motorista || 'a definir'}</dd>
              <dt>Passageiros</dt><dd>{base.passageiros.join(', ')}</dd>
              {baseInfo && baseInfo.vagas !== null && <><dt>Lugares livres</dt><dd>{baseInfo.vagas}{baseInfo.vagas < ef.passageiros.length ? ' (menos que o encaixe pede)' : ''}</dd></>}
            </dl>
            {!AGENDADA(base) && <p className="nota alt"><b>A viagem principal não está mais agendada</b>Recuse o encaixe; a pessoa pode fazer um pedido normal.</p>}
          </>)}
        </div>
      )}

      {!encaixe && (
        <div className="painel">
          <h2>{cap(fmtLonga(ef.data))}</h2>
          {!disp ? <Carregando txt="Consultando a agenda…" /> : (<>
            <Regua data={ef.data} eventos={eventosVis} capacidade={Math.max(1, disp.veiculos.length)} janelas={bl} conflito={conf.conflito} />
            <div className={'disp ' + (conf.conflito ? 'ocupado' : 'livre')}>
              <span>{conf.conflito ? 'Todos os veículos estão ocupados nesse horário' : `${conf.capacidade - conf.ocupados} de ${conf.capacidade} veículo(s) livre(s)`}
                {ef.modo === 'LEVA_BUSCA' && bl.length > 1 && <small>Carro reservado das {hm(bl[0].a)} às {hm(bl[0].b)} e das {hm(bl[1].a)} às {hm(bl[1].b)}; livre no meio.</small>}
                {conf.semPlaca > 0 && <small>{conf.semPlaca} evento(s) na agenda sem placa no título: não dá para saber qual carro usam.</small>}
              </span>
            </div>
            {!['RECUSADA', 'CANCELADA'].includes(s.status) && (<>
              <h2 style={{ marginTop: 18 }}>Como vai ser a viagem</h2>
              <div className="seg" role="tablist">
                <button role="tab" aria-selected={modoViagem === 'ACOMPANHA'} className={modoViagem === 'ACOMPANHA' ? 'ativo' : ''} onClick={() => setModoViagem('ACOMPANHA')}>Motorista acompanha</button>
                <button role="tab" aria-selected={modoViagem === 'LEVA_BUSCA'} className={modoViagem === 'LEVA_BUSCA' ? 'ativo' : ''} onClick={() => setModoViagem('LEVA_BUSCA')}>Só leva e busca</button>
              </div>
              {modoViagem === 'LEVA_BUSCA' && (
                <div className="linha2" style={{ marginTop: 12 }}>
                  <div className="campo" style={{ marginBottom: 0 }}><label htmlFor="hlv">Levar às</label><input id="hlv" type="time" value={horaLevar} onChange={e => setHoraLevar(e.target.value)} /></div>
                  <div className="campo" style={{ marginBottom: 0 }}><label htmlFor="hbs">Buscar às</label><input id="hbs" type="time" value={horaBuscar} onChange={e => setHoraBuscar(e.target.value)} /></div>
                </div>
              )}
            </>)}
          </>)}
        </div>
      )}

      {!encaixe && !['RECUSADA', 'CANCELADA'].includes(s.status) && disp && (
        <div className="painel">
          <h2>Veículo</h2>
          {disp.veiculos.length === 0
            ? <p className="nota obs" style={{ marginTop: 0 }}>Nenhum veículo cadastrado. Cadastre em Cadastros para registrar a placa no Google Agenda.</p>
            : <div className="veics" role="radiogroup" aria-label="Veículo">
              {disp.veiculos.map(v => {
                const ocup = conf.placasOcupadas.includes(v.placa);
                const pouco = v.lugares && v.lugares - 1 < ef.passageiros.length;
                const bq = bloqueioDe(disp.bloqueios, { veiculoId: v.id }, ef.data, bl);
                return (
                  <button key={v.id} type="button" role="radio" disabled={!!bq} aria-checked={veiculoId === v.id} className={'veic-op' + (veiculoId === v.id ? ' sel' : '') + (bq ? ' bloq' : '')} onClick={() => escolherVeiculo(v)}>
                    <span className="placa">{v.placa}</span>
                    <span className="mod">{v.modelo || 'Veículo'}<small>{bq ? `${bq.motivo}, até ${fimBloq(bq)}` : <>{[v.lugares ? `${v.lugares} lugares` : '', v.motorista ? `motorista fixo ${v.motorista}` : 'sem motorista fixo'].filter(Boolean).join(', ')}{pouco ? '. Poucos lugares para o grupo' : ''}</>}</small></span>
                    <span className={'veic-st ' + (bq || ocup ? 'ocup' : 'livre')}>{bq ? 'Bloqueado' : ocup ? 'Ocupado' : 'Livre'}</span>
                  </button>
                );
              })}
            </div>}

          <h2 style={{ marginTop: 20 }}>Motorista</h2>
          <div className="seg" style={{ marginBottom: 12 }} role="tablist">
            <button role="tab" aria-selected={modoMot === 'agora'} className={modoMot === 'agora' ? 'ativo' : ''} onClick={() => trocarModoMot('agora')}>Definir agora</button>
            <button role="tab" aria-selected={modoMot === 'depois'} className={modoMot === 'depois' ? 'ativo' : ''} onClick={() => trocarModoMot('depois')}>Definir depois (pré-agendar)</button>
          </div>
          {modoMot === 'depois' ? (
            <p className="nota pre" style={{ marginTop: 0 }}><b>O carro fica reservado</b>Na agenda, o horário aparece como pré-agendado. Você recebe um lembrete por e-mail quando a data estiver chegando.</p>
          ) : (<>
            <PainelMotoristas nomes={nomes} todas={todas} bloqueios={disp.bloqueios} solId={s.id} data={ef.data} alvo={bl} valor={motorista} fixo={vs && vs.motorista} escolher={setMotorista} />
            <div className="campo" style={{ marginTop: 12 }}>
              <label htmlFor="mo">Quem vai dirigir</label>
              <span className="dica">Toque num motorista acima ou digite outro nome (ex.: um servidor que vai dirigir).</span>
              <input id="mo" type="text" value={motorista} onChange={e => setMotorista(e.target.value)} />
            </div>
          </>)}
          <div className="campo" style={{ marginBottom: 0 }}><label htmlFor="ob">Observação para o solicitante <span className="dica">(opcional)</span></label><input id="ob" type="text" placeholder="Ex.: sair do pátio da SEME" value={obs} onChange={e => setObs(e.target.value)} /></div>
        </div>
      )}

      {encaixesDaViagem.length > 0 && (
        <div className="painel">
          <h2>Encaixes nesta viagem</h2>
          <ul className="lista-simples">{encaixesDaViagem.map(x => <li key={x.id}>#{x.id} {x.solicitante} → {x.destino} ({x.passageiros.length}) <span className={'pill ' + x.status}>{STATUS[x.status]}</span></li>)}</ul>
        </div>
      )}

      {s.status === 'APROVADA' && !encaixe && s.motorista && (
        <div className="painel">
          <h2>Avisar o motorista</h2>
          {motCad && telWhats(motCad.telefone)
            ? <a className="btn prim" href={`https://wa.me/${telWhats(motCad.telefone)}?text=${encodeURIComponent(msgMotorista())}`} target="_blank" rel="noopener">Enviar a viagem para {s.motorista.split(' ')[0]} no WhatsApp</a>
            : <><p className="dica" style={{ marginTop: 0, color: 'var(--muted)' }}>{motCad ? 'Cadastre o telefone do motorista para enviar direto para ele.' : 'Motorista sem cadastro: o WhatsApp abre para você escolher o contato.'}</p>
              <a className="btn contorno" href={`https://wa.me/?text=${encodeURIComponent(msgMotorista())}`} target="_blank" rel="noopener">Enviar pelo WhatsApp</a></>}
        </div>
      )}

      <div className="painel"><Historico itens={s.historico} /></div>

      <div className="acoes-fim" style={{ marginTop: 16 }}>
        {pendente && <>
          <button className="btn perigo" disabled={enviando} onClick={() => setModo('recusar')}>{s.status === 'ALTERACAO_PENDENTE' ? 'Recusar alteração' : 'Recusar'}</button>
          <button className="btn prim" disabled={enviando || (encaixe && base && !AGENDADA(base))} onClick={aprovar} style={{ flex: 1 }}>{enviando ? 'Salvando…' : rotAprovar}</button>
        </>}
        {AGENDADA(s) && <>
          <button className="btn perigo" disabled={enviando} onClick={() => setModo('cancelar')}>{encaixe ? 'Cancelar encaixe' : 'Cancelar agendamento'}</button>
          {!encaixe && <button className="btn prim" disabled={enviando} onClick={aprovar} style={{ flex: 1 }}>{enviando ? 'Salvando…' : rotAprovar}</button>}
        </>}
      </div>

      {modo === 'recusar' && (
        <PerguntaModal titulo={s.status === 'ALTERACAO_PENDENTE' ? 'Recusar a alteração' : 'Recusar o pedido'} perigo obrigatorio
          botao={s.status === 'ALTERACAO_PENDENTE' ? 'Recusar alteração' : 'Recusar pedido'} rotulo="Motivo (vai no e-mail para o solicitante)"
          texto={s.status === 'ALTERACAO_PENDENTE' ? 'O agendamento atual continua valendo.' : null}
          fechar={() => setModo(null)}
          confirmar={motivo => acao('recusar', { motivo }, s.status === 'ALTERACAO_PENDENTE' ? `Alteração da #${s.id} recusada.` : `Pedido #${s.id} recusado.`)} />
      )}
      {modo === 'cancelar' && (
        <PerguntaModal titulo={encaixe ? 'Cancelar o encaixe' : 'Cancelar o agendamento'} perigo botao="Cancelar" rotulo="Motivo (vai no e-mail para o solicitante)"
          texto={encaixe ? 'A pessoa sai desta viagem.' : `O evento sai do Google Agenda.${encaixesDaViagem.length ? ' Os encaixes desta viagem também são cancelados.' : ''}`} fechar={() => setModo(null)}
          confirmar={motivo => acao('cancelarSolicitacao', { motivo }, `Pedido #${s.id} cancelado.`)} />
      )}
    </Modal>
  );
}

/* ============================ mensagem do dia ============================ */
const horaZap = h => String(h || '').replace(':', 'h');
const juntarNomes = l => {
  const n = l.map(x => String(x).trim().toUpperCase()).filter(Boolean);
  return n.length <= 1 ? (n[0] || '') : `${n.slice(0, -1).join(', ')} E ${n[n.length - 1]}`;
};
const pessoaLocal = (pass, dest) => `${juntarNomes(pass)} - ${String(dest || '').trim().toUpperCase()}`;
const RODAPE_ZAP = '⚠️ Obs.: \n\n_Qualquer alteração de local, mudança de pessoa, cancelamento, ou qualquer mudança que altere a agenda, favor entrar em contato comigo no privado_';

/*
 * Padrão da mensagem: agrupa por quem dirige.
 *  - Motorista cadastrado: "● *JAMILSON:*"
 *  - Outra pessoa dirigindo: "● *EDNISIA - SPIN - RQV2A75:*"
 *  - Pré-agendado sem motorista: "● *⚠️ MOTORISTA A DEFINIR - SPIN - RQV2A75:*"
 * Cada viagem: "⏰ - 08h00 às 12h00 - PESSOAS - LOCAL". Viagem com encaixes vira lista.
 * Leva e busca: "⏰ - 08h00 - (LEVAR) - ..." e "⏰ - 10h30 - (BUSCAR) - ...".
 */
function montarMensagem(data, itens, motoristas = []) {
  const d = parseYmd(data);
  const cab = `📅 *AGENDAMENTO DE VEÍCULOS/MOTORISTAS* 🚗\n\n📌 *${DIAS[d.getDay()].toUpperCase()} - ${fmtCurta(data)}/${d.getFullYear()}*`;
  const cadastrados = motoristas.map(m => m.nome.trim().toLowerCase());
  const bloqs = itens.filter(it => it.bloqueio).map(it => it.bloqueio);
  itens = itens.filter(it => !it.bloqueio);
  const indisp = bloqs.length ? `🚫 *INDISPONÍVEIS:*\n${bloqs.map(b => b.tipo === 'VEICULO'
    ? `- ${[b.modelo, b.placa].filter(Boolean).join(' - ').toUpperCase()}: ${b.motivo}`
    : `- ${cadastrados.includes(b.motorista.toLowerCase()) ? b.motorista.split(' ')[0] : b.motorista}: ${b.motivo}`).join('\n')}\n\n\n` : '';
  if (!itens.length) return `${cab}\n\nNão há veículos agendados para este dia.\n\n\n${indisp}${RODAPE_ZAP}`;
  const grupos = {};
  itens.forEach(it => {
    const s = it.sol;
    const mot = String((s ? s.motorista : it.motoristaFixo) || '').trim();
    const veic = [it.modelo, it.placa].filter(Boolean).join(' - ').toUpperCase();
    const primeiro = mot.split(/\s+/)[0].toUpperCase();
    let chave, titulo, ordem;
    if (mot && cadastrados.includes(mot.toLowerCase())) { chave = 'm' + mot.toLowerCase(); titulo = primeiro; ordem = 0; }
    else if (mot) { chave = 'o' + mot.toLowerCase() + it.placa; titulo = [primeiro, veic].filter(Boolean).join(' - '); ordem = 1; }
    else { chave = 'd' + it.placa; titulo = ['⚠️ MOTORISTA A DEFINIR', veic].filter(Boolean).join(' - '); ordem = 2; }
    if (!grupos[chave]) grupos[chave] = { titulo, ordem, linhas: [] };

    let hora, rot = '', destinos, chaveHora;
    if (!s) {
      hora = it.diaTodo ? 'dia inteiro' : `${horaZap(it.inicio)} às ${horaZap(it.fim)}`;
      destinos = [[it.titulo.replace(/\[[^\]]+\]\s*/, '').replace(/^\(pré\)\s*/, ''), it.local].filter(Boolean).join(' - ').toUpperCase()];
      chaveHora = it.inicio || '00:00';
    } else {
      if (it.perna === 'ida') { hora = horaZap(s.horaIda); rot = ' - (LEVAR)'; chaveHora = s.horaIda; }
      else if (it.perna === 'volta') { hora = horaZap(s.horaRetorno); rot = ' - (BUSCAR)'; chaveHora = s.horaRetorno; }
      else { hora = `${horaZap(s.horaIda)} às ${horaZap(s.horaRetorno)}`; chaveHora = s.horaIda; }
      destinos = [pessoaLocal(s.passageiros, s.destino), ...(it.encaixes || []).map(e => pessoaLocal(e.passageiros, e.destino))];
    }
    const texto = destinos.length === 1 ? `⏰ - ${hora}${rot} - ${destinos[0]}` : `⏰ - ${hora}${rot}:\n${destinos.map(x => `- ${x}`).join('\n')}`;
    grupos[chave].linhas.push({ chaveHora, texto });
  });
  const lista = Object.values(grupos).map(g => ({ ...g, linhas: g.linhas.sort((a, b) => a.chaveHora.localeCompare(b.chaveHora)) }))
    .sort((a, b) => a.ordem - b.ordem || a.linhas[0].chaveHora.localeCompare(b.linhas[0].chaveHora));
  const corpo = lista.map(g => `● *${g.titulo}:*\n\n${g.linhas.map(l => l.texto).join('\n\n')}`).join('\n\n\n');
  return `${cab}\n\n\n${corpo}\n\n\n${indisp}\n${RODAPE_ZAP}`;
}

function Bolha({ texto }) {
  const partes = texto.split(/(\*[^*\n]+\*|_[^_\n]+_)/g);
  return <div className="zap-bolha">{partes.map((p, i) => /^\*[^*]+\*$/.test(p) ? <b key={i}>{p.slice(1, -1)}</b> : /^_[^_]+_$/.test(p) ? <i key={i}>{p.slice(1, -1)}</i> : p)}</div>;
}
