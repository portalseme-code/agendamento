<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#094A3E">
<title>Agenda de Veículos — SEME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F0; --card:#FFFFFF; --ink:#16282B; --muted:#5B6B68; --line:#D5DCD7;
  --pine:#0E6B5A; --pine-d:#094A3E; --mint:#DCEEE7; --lane:#E6EBE7;
  --amber:#9A5B00; --amber-w:#FBEFD5; --amber-b:#E9A93A;
  --red:#AE3327; --red-w:#F8E0DC; --slate:#6E7D7A; --slate-w:#E9ECEA;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Public Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--amber-b);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estrutura ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topo{background:var(--pine-d);color:#fff;position:sticky;top:0;z-index:30}
.topo-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.marca svg{flex:none}
.marca b{font-family:var(--display);font-size:1.15rem;font-weight:700;white-space:nowrap}
.marca small{display:block;font-size:.75rem;opacity:.75;margin-top:-2px}
.quem{display:flex;align-items:center;gap:8px}
.quem-nome{text-align:right;font-size:.85rem;line-height:1.2}
.quem-nome span{display:block;opacity:.7;font-size:.75rem}
@media (max-width:480px){.quem-nome{display:none}.marca small{display:none}}
.icone-btn{background:rgba(255,255,255,.1);border:0;color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.icone-btn:hover{background:rgba(255,255,255,.2)}
.nav-desk{display:none}
.corpo{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:22px 16px 110px}
.nav-mob{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-mob button{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted);cursor:pointer;min-height:58px}
.nav-mob button.ativo{color:var(--pine);font-weight:700}
.nav-mob .badge{position:absolute;margin-left:18px;margin-top:-4px}
.nav-mob button>span{position:relative}
@media (min-width:860px){
  .nav-mob{display:none}
  .nav-desk{display:flex;gap:4px;max-width:1080px;margin:0 auto;padding:0 18px}
  .nav-desk button{background:none;border:0;color:rgba(255,255,255,.72);padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500;display:flex;align-items:center;gap:8px}
  .nav-desk button.ativo{color:#fff;border-bottom-color:var(--amber-b)}
  .corpo{padding-bottom:48px}
}
.badge{background:var(--amber-b);color:#2b1a00;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px}

.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.cab h1{font-size:1.75rem}
.cab p{margin:4px 0 0;color:var(--muted)}
.painel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.painel+.painel{margin-top:14px}
.painel h2{font-size:1.1rem;margin-bottom:12px}
.vazio{text-align:center;padding:36px 16px;color:var(--muted)}
.vazio b{display:block;color:var(--ink);font-family:var(--display);font-size:1.15rem;margin-bottom:4px}

/* ---------- formulários ---------- */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-weight:600;font-size:.9rem}
.campo .dica{font-size:.8rem;color:var(--muted);font-weight:400}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
textarea{resize:vertical;min-height:92px}
input:focus,select:focus,textarea:focus{border-color:var(--pine);outline:none;box-shadow:0 0 0 3px var(--mint)}
.invalido{border-color:var(--red)!important}
.erro-campo{color:var(--red);font-size:.8rem}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:11px;padding:0 18px;min-height:48px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--slate-w);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.prim{background:var(--pine);color:#fff}
.btn.prim:hover:not(:disabled){background:var(--pine-d)}
.btn.perigo{background:var(--red-w);color:var(--red)}
.btn.contorno{background:#fff;border:1.5px solid var(--line)}
.btn.pequeno{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:9px}
.btn.cheio{width:100%}
.acoes{display:flex;gap:10px;flex-wrap:wrap}
.acoes-fim{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.fixo-rodape{position:sticky;bottom:70px;margin-top:18px;background:linear-gradient(transparent,var(--paper) 30%);padding-top:14px}
@media (min-width:860px){.fixo-rodape{bottom:0}}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--amber);flex:none}
.seg{display:inline-flex;background:var(--slate-w);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.ativo{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,40,43,.12)}

/* ---------- aviso global ---------- */
.aviso{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:100;width:min(560px,calc(100% - 24px));
  border-radius:14px;padding:16px 16px 16px 18px;display:flex;gap:12px;align-items:flex-start;color:#fff;font-weight:600;
  animation:entra .28s ease-out, pulsa 1.8s ease-in-out .3s infinite}
.aviso.ok{background:var(--pine)}
.aviso.erro{background:var(--red)}
.aviso p{margin:0;flex:1;line-height:1.35}
.aviso button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none}
@keyframes entra{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulsa{0%,100%{box-shadow:0 8px 24px rgba(22,40,43,.25)}50%{box-shadow:0 8px 34px rgba(22,40,43,.45)}}
.demo{background:var(--amber-w);color:var(--amber);font-size:.85rem;text-align:center;padding:8px 12px;border-bottom:1px solid #EFD9A6}

/* ---------- régua do dia ---------- */
.regua{--lh:18px;--gap:4px;user-select:none}
.regua-trilha{position:relative}
.regua-hora{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.regua-pista{position:absolute;left:0;right:0;height:var(--lh);background:var(--lane);border-radius:5px}
.regua-bloco{position:absolute;height:var(--lh);border-radius:5px;background:var(--slate);color:#fff;font-size:.68rem;font-weight:700;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;letter-spacing:.02em;border:0;cursor:default}
.regua-bloco.clic{cursor:pointer}
.regua-bloco.meu{background:var(--pine)}
.regua-bloco.excesso{background:var(--red)}
.regua-janela{position:absolute;top:-6px;bottom:-6px;border:2.5px solid var(--pine);border-radius:8px;background:rgba(14,107,90,.10);pointer-events:none;transition:left .2s,width .2s}
.regua-janela.conflito{border-color:var(--red);background:rgba(174,51,39,.10)}
.regua-escala{position:relative;height:18px;margin-top:8px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.regua-escala span{position:absolute;transform:translateX(-50%)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:10px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

.disp{border-radius:12px;padding:12px 14px;margin:14px 0 4px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.disp.livre{background:var(--mint);color:var(--pine-d)}
.disp.ocupado{background:var(--red-w);color:var(--red)}
.disp.neutro{background:var(--slate-w);color:var(--muted);font-weight:500}
.disp small{display:block;font-weight:400;opacity:.9;margin-top:2px}
.urgente-box{background:var(--amber-w);border:1.5px solid #EFD9A6;border-radius:12px;padding:14px;margin-top:10px}
.urgente-box p{margin:6px 0 12px 32px;font-size:.88rem;color:var(--amber)}

/* ---------- agenda semanal ---------- */
.semana-nav{display:flex;align-items:center;gap:8px}
.semana-nav strong{font-family:var(--display);font-size:1.05rem;min-width:150px;text-align:center}
.dia{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.dia:first-child{border-top:0;padding-top:4px}
.dia.hoje .dia-rot b{color:var(--pine)}
.dia-rot{text-align:center;line-height:1.05}
.dia-rot span{display:block;font-size:.78rem;color:var(--muted)}
.dia-rot b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:700}
.dia-rot em{display:block;font-style:normal;font-size:.72rem;color:var(--muted)}
.dia-itens{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.dia-item{font-size:.86rem;display:flex;gap:10px;align-items:baseline}
.dia-item time{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.dia-item.pend{color:var(--amber)}
.dia-rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.livre-txt{font-size:.82rem;color:var(--pine);font-weight:600}
.cheio-txt{font-size:.82rem;color:var(--red);font-weight:600}

/* ---------- cartões de solicitação ---------- */
.lista{display:flex;flex-direction:column;gap:12px}
.sol{display:grid;grid-template-columns:72px 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;width:100%;padding:0}
.sol.clic{cursor:pointer}
.sol.clic:hover{border-color:var(--pine)}
.sol-data{background:var(--mint);color:var(--pine-d);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;border-right:2px dashed #fff;line-height:1.05}
.sol-data span{font-size:.72rem}
.sol-data b{font-family:var(--display);font-size:1.8rem}
.sol.st-PENDENTE .sol-data,.sol.st-ALTERACAO_PENDENTE .sol-data{background:var(--amber-w);color:var(--amber)}
.sol.st-RECUSADA .sol-data,.sol.st-CANCELADA .sol-data{background:var(--slate-w);color:var(--slate)}
.sol-corpo{padding:14px 16px}
.sol-topo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sol-id{margin-left:auto;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sol h3{font-size:1.1rem;margin-bottom:2px}
.sol-hora{font-weight:700;font-variant-numeric:tabular-nums;margin:0}
.sol-info{margin:6px 0 0;color:var(--muted);font-size:.88rem}
.sol-info b{color:var(--ink);font-weight:600}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.PENDENTE,.pill.ALTERACAO_PENDENTE{background:var(--amber-w);color:var(--amber)}
.pill.APROVADA{background:var(--mint);color:var(--pine-d)}
.pill.RECUSADA{background:var(--red-w);color:var(--red)}
.pill.CANCELADA{background:var(--slate-w);color:var(--slate)}
.pill.urg{background:var(--amber-b);color:#2b1a00}
.pill.conf{background:var(--red);color:#fff}
.nota{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.86rem}
.nota.alt{background:var(--amber-w);color:var(--amber)}
.nota.obs{background:var(--slate-w);color:var(--ink)}
.nota b{display:block;margin-bottom:2px}
.sol-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
details.hist{margin-top:10px;font-size:.84rem}
details.hist summary{cursor:pointer;color:var(--pine);font-weight:600}
.hist ol{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.hist li{margin-bottom:8px;position:relative}
.hist li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pine)}
.hist li span{display:block;color:var(--muted);font-size:.76rem}
.grupo-tit{font-family:var(--display);font-size:1.05rem;margin:26px 0 10px;color:var(--muted);font-weight:500}
.grupo-tit:first-child{margin-top:0}

.filtros{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filtros button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:.88rem;display:flex;gap:6px;align-items:center}
.filtros button.ativo{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- modal ---------- */
.fundo{position:fixed;inset:0;background:rgba(10,30,28,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:sobe .22s ease-out}
@media (min-width:700px){.fundo{align-items:center}.modal{border-radius:20px;max-height:88vh}}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.modal-cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-cab h2{font-size:1.35rem;flex:1}
.fechar{background:var(--slate-w);border:0;border-radius:10px;width:40px;height:40px;cursor:pointer;flex:none;display:grid;place-items:center}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500}
.antes-depois{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.86rem}
.antes-depois div{border-radius:10px;padding:10px}
.antes-depois .antes{background:var(--slate-w);color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(91,107,104,.5)}
.antes-depois .depois{background:var(--amber-w);color:var(--amber);font-weight:600}
.veics{display:flex;flex-direction:column;gap:8px}
.veic-op{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.veic-op.sel{border-color:var(--pine);box-shadow:0 0 0 3px var(--mint)}
.veic-op .placa{font-family:var(--display);font-weight:700;letter-spacing:.04em;background:var(--ink);color:#fff;border-radius:6px;padding:3px 8px;font-size:.9rem}
.veic-op .mod{flex:1;font-size:.88rem}
.veic-op .mod small{display:block;color:var(--muted)}
.veic-st{font-size:.76rem;font-weight:700;padding:3px 8px;border-radius:999px}
.veic-st.livre{background:var(--mint);color:var(--pine-d)}
.veic-st.ocup{background:var(--red-w);color:var(--red)}

/* ---------- mensagem do dia ---------- */
.zap{background:#E6DDD4;border-radius:16px;padding:16px;min-height:120px}
.zap-bolha{background:#D9FDD3;border-radius:10px 0 10px 10px;padding:10px 12px;margin-left:auto;max-width:92%;white-space:pre-wrap;font-size:.9rem;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08)}

/* ---------- cadastros ---------- */
.tabela{width:100%;border-collapse:collapse;font-size:.9rem}
.tabela th{text-align:left;color:var(--muted);font-weight:600;font-size:.8rem;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.tabela td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabela-rolagem{overflow-x:auto}
.inativo{opacity:.5}
.grade-cad{display:grid;gap:14px}
.grade-cad>*,.rel-grade>*{min-width:0}
@media (min-width:860px){.grade-cad{grid-template-columns:340px 1fr;align-items:start}}

/* ---------- avisos ---------- */
.aviso-item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:14px 16px}
.aviso-item.bom{border-left-color:var(--pine)}
.aviso-item.ruim{border-left-color:var(--red)}
.aviso-item.info{border-left-color:var(--amber-b)}
.aviso-acao{margin:0 0 4px;font-weight:700;font-family:var(--display);font-size:1.05rem;line-height:1.25}
.aviso-quando{margin:6px 0 0;font-size:.78rem;color:var(--muted)}

/* ---------- relatórios ---------- */
.numeros{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.numeros div{background:var(--card);padding:12px 14px}
.numeros b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.numeros span{font-size:.8rem;color:var(--muted)}
.rel-grade{display:grid;gap:14px;margin:14px 0}
@media (min-width:860px){.rel-grade{grid-template-columns:1fr 1fr;align-items:start}}
.rel-grade .painel+.painel{margin-top:0}
.barras{display:flex;flex-direction:column;gap:12px}
.barra-rot{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-bottom:4px}
.barra-rot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-rot b{font-variant-numeric:tabular-nums;white-space:nowrap}
.barra-trilha{height:10px;background:var(--lane);border-radius:5px;overflow:hidden}
.barra-trilha div{height:100%;background:var(--pine);border-radius:5px}
.barra small{font-size:.76rem;color:var(--muted)}
.painel-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.painel-cab h2{margin:0}
.so-imprimir{display:none}
@media print{
  html,body{background:#fff}
  .topo,.nav-mob,.demo,.nao-imprimir,.aviso{display:none!important}
  .corpo{padding:0;max-width:none}
  .so-imprimir{display:block;margin:0 0 12px;font-size:.85rem}
  .painel{break-inside:avoid;border-color:#bbb}
  .barra-trilha div,.barra-trilha{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rel-grade{grid-template-columns:1fr 1fr}
}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--pine-d);position:relative;overflow:hidden}
.login-regua{position:absolute;left:0;right:0;top:12%;opacity:.16;pointer-events:none}
.login-regua div{height:26px;border-radius:6px;background:#fff;position:absolute}
.login-caixa{position:relative;width:min(400px,100%)}
.login-marca{color:#fff;margin-bottom:22px}
.login-marca h1{font-size:2.3rem;line-height:1.02}
.login-marca p{margin:10px 0 0;opacity:.8}
.login-form{background:var(--paper);border-radius:18px;padding:22px}
.carregando{display:grid;place-items:center;padding:40px;color:var(--muted)}
.giro{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--pine);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- v3: pré-agendado, prévia, encaixe, motoristas ---------- */
:root{--sky:#2E4A78;--sky-w:#E4EAF4}
.regua-bloco.pre{background:repeating-linear-gradient(135deg,#6E7D7A 0 5px,#98A6A3 5px 10px)}

.legenda i.hachura{background:repeating-linear-gradient(135deg,#6E7D7A 0 3px,#98A6A3 3px 6px)}
.pill.PRE_AGENDADA{background:var(--sky-w);color:var(--sky)}

.dia-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 8px;margin:0 -8px;cursor:pointer;font-size:.86rem;color:var(--ink);width:calc(100% + 16px)}

.perna{font-style:normal;font-size:.7rem;font-weight:700;background:var(--ink);color:#fff;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
