/* ============================ relatórios ============================ */
const PERIODOS = [['mes', 'Este mês'], ['anterior', 'Mês passado'], ['3m', 'Últimos 3 meses'], ['ano', 'Este ano'], ['outro', 'Escolher datas']];
function intervaloPeriodo(k) {
  const h = new Date(), y = h.getFullYear(), m = h.getMonth();
  if (k === 'mes') return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))];
  if (k === 'anterior') return [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))];
  if (k === '3m') return [ymd(new Date(y, m - 2, 1)), ymd(new Date(y, m + 1, 0))];
  return [ymd(new Date(y, 0, 1)), ymd(new Date(y, 11, 31))];
}

const duracaoH = horasDe;
const fmtH = h => { const t = Math.round(h * 60), hh = Math.floor(t / 60), mm = t % 60; return mm ? `${hh}h${pad(mm)}` : `${hh}h`; };
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

const CONTA_COMO_APROVADA = s => ['APROVADA', 'PRE_AGENDADA', 'ALTERACAO_PENDENTE'].includes(s.status);
function tempoResposta(s) {
  const d = (s.historico || []).find(x => x.porId !== s.usuarioId && /^(Confirmado|Pré-agendado|Recusado|Encaixe aprovado|Aprovada|Recusada)/.test(x.acao));
  if (!d || !s.criadoEm) return null;
  return Math.max(0, (parseDT(d.em).getTime() - parseDT(s.criadoEm).getTime()) / 36e5);
}
const fmtResp = h => h < 1 ? 'menos de 1 h' : h < 24 ? `${Math.round(h)} h` : `${(h / 24).toFixed(1).replace('.', ',')} dias`;
function agrupar(lista, chave, somar = () => 1, extra) {
  const m = {};
  lista.forEach(s => {
    const k = chave(s) || 'Não informado';
    if (!m[k]) m[k] = { rot: k, valor: 0, n: 0, h: 0, a: 0 };
    m[k].valor += somar(s); m[k].n++; m[k].h += duracaoH(s); if (CONTA_COMO_APROVADA(s)) m[k].a++;
  });
  return Object.values(m).sort((a, b) => b.valor - a.valor);
}
function Barras({ itens, fmt = v => v, extra, limite }) {
  if (!itens.length) return <p className="dica" style={{ margin: 0, color: 'var(--muted)' }}>Sem dados no período.</p>;
  const mx = Math.max(...itens.map(i => i.valor), 1);
  const vis = limite ? itens.slice(0, limite) : itens;
  return (
    <div className="barras">{vis.map(i => (
      <div key={i.rot} className="barra">
        <div className="barra-rot"><span title={i.rot}>{i.rot}</span><b>{fmt(i.valor)}</b></div>
        <div className="barra-trilha"><div style={{ width: `${(i.valor / mx) * 100}%` }} /></div>
        {extra && <small>{extra(i)}</small>}
      </div>))}
    </div>
  );
}
function baixarCSV(nome, linhas) {
  const esc = v => { const s = String(v === null || v === undefined ? '' : v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const blob = new Blob(['\ufeff' + linhas.map(l => l.map(esc).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}


function Relatorios({ admin }) {
  const aviso = useAviso();
  const [todas, setTodas] = useState(null);
  const [veics, setVeics] = useState([]);
  const [per, setPer] = useState('mes');
  const [de, setDe] = useState(() => intervaloPeriodo('mes')[0]);
  const [ate, setAte] = useState(() => intervaloPeriodo('mes')[1]);
  const [agrup, setAgrup] = useState('setor');
  useEffect(() => {
    api(admin ? 'listarSolicitacoes' : 'minhasSolicitacoes').then(setTodas).catch(e => { aviso('erro', e.message); setTodas([]); });
    if (admin) api('veiculos').then(setVeics).catch(() => { });
  }, []);
  const escolher = k => { setPer(k); if (k !== 'outro') { const [a, b] = intervaloPeriodo(k); setDe(a); setAte(b); } };
  if (!todas) return <Carregando />;

  const lista = todas.filter(s => s.data >= de && s.data <= ate).sort((a, b) => (a.data + a.horaIda).localeCompare(b.data + b.horaIda));
  const aprov = lista.filter(CONTA_COMO_APROVADA);
  const viagens = aprov.filter(s => s.tipo !== 'ENCAIXE');
  const encaixes = aprov.filter(s => s.tipo === 'ENCAIXE');
  const horas = viagens.reduce((t, s) => t + duracaoH(s), 0);
  const n = (...st) => lista.filter(s => st.includes(s.status)).length;
  const resp = lista.map(tempoResposta).filter(x => x !== null);
  const mediaResp = resp.length ? resp.reduce((a, b) => a + b, 0) / resp.length : null;
  const rotPeriodo = `${fmtCurta(de)}/${de.slice(0, 4)} a ${fmtCurta(ate)}/${ate.slice(0, 4)}`;

  const porVeic = (() => {
    const b = {};
    veics.forEach(v => { b[v.placa] = { rot: v.placa + (v.modelo ? ` (${v.modelo})` : ''), valor: 0, n: 0 }; });
    viagens.forEach(s => { const k = s.placa || '—'; if (!b[k]) b[k] = { rot: k === '—' ? 'Sem veículo' : k, valor: 0, n: 0 }; b[k].valor += duracaoH(s); b[k].n++; });
    return Object.values(b).sort((x, y) => y.valor - x.valor);
  })();
  const porMot = agrupar(viagens, s => s.motorista || 'A definir');
  const porQuem = agrupar(lista, s => agrup === 'setor' ? s.setor : s.solicitante);
  const destinos = agrupar(aprov, s => s.destino);
  const dias = (() => {
    const c = [0, 0, 0, 0, 0, 0, 0];
    viagens.forEach(s => c[parseYmd(s.data).getDay()]++);
    return [1, 2, 3, 4, 5, 6, 0].filter(i => (i >= 1 && i <= 5) || c[i]).map(i => ({ rot: cap(DIAS[i]), valor: c[i] }));
  })();
  const meses = (() => {
    const m = {};
    lista.forEach(s => { const k = s.data.slice(0, 7); m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).sort().map(k => ({ rot: `${cap(MESES[Number(k.slice(5)) - 1])}/${k.slice(0, 4)}`, valor: m[k] }));
  })();

  const exportar = () => baixarCSV(`relatorio-veiculos-${de}-a-${ate}.csv`, [
    ['Nº', 'Tipo', 'Viagem principal', 'Data', 'Saída', 'Retorno ou busca', 'Modo', 'Horas de carro', 'Destino', 'Passageiros', 'Qtde. passageiros', 'Finalidade', 'Solicitante', 'Setor', 'Situação', 'Urgente', 'Veículo', 'Motorista', 'Pedido em'],
    ...lista.map(s => [s.id, s.tipo === 'ENCAIXE' ? 'Encaixe' : 'Viagem', s.encaixeDe || '', `${fmtCurta(s.data)}/${s.data.slice(0, 4)}`, s.horaIda, s.horaRetorno,
      s.modo === 'LEVA_BUSCA' ? 'Leva e busca' : 'Acompanha', s.tipo === 'ENCAIXE' ? '0' : duracaoH(s).toFixed(2).replace('.', ','),
      s.destino, s.passageiros.join(', '), s.passageiros.length, s.finalidade || '', s.solicitante, s.setor || '', STATUS[s.status],
      s.urgente ? 'Sim' : 'Não', s.placa || '', s.motorista || '', s.criadoEm || '']),
  ]);

  return (
    <>
      <div className="cab">
        <div><h1>Relatórios</h1><p>{admin ? 'Uso dos veículos, motoristas e pedidos no período.' : 'Resumo dos seus pedidos no período.'}</p></div>
        <div className="acoes nao-imprimir">
          <button className="btn contorno pequeno" onClick={exportar} disabled={!lista.length}>Baixar planilha</button>
          <button className="btn contorno pequeno" onClick={() => window.print()} disabled={!lista.length}>Imprimir</button>
        </div>
      </div>
      <p className="so-imprimir">Agenda de veículos, SEME. Período: {rotPeriodo}.</p>
      <div className="filtros nao-imprimir" role="tablist">
        {PERIODOS.map(([k, rot]) => <button key={k} role="tab" aria-selected={per === k} className={per === k ? 'ativo' : ''} onClick={() => escolher(k)}>{rot}</button>)}
      </div>
      {per === 'outro' && (
        <div className="linha2 nao-imprimir" style={{ maxWidth: 440 }}>
          <div className="campo"><label htmlFor="rde">De</label><input id="rde" type="date" value={de} onChange={e => e.target.value && setDe(e.target.value)} /></div>
          <div className="campo"><label htmlFor="rate">Até</label><input id="rate" type="date" value={ate} onChange={e => e.target.value && setAte(e.target.value)} /></div>
        </div>
      )}

      <div className="painel">
        <h2>Resumo de {rotPeriodo}</h2>
        <div className="numeros">
          <div><b>{lista.length}</b><span>pedidos</span></div>
          <div><b>{viagens.length}</b><span>viagens agendadas</span></div>
          <div><b>{encaixes.length}</b><span>{admin ? 'encaixes (carro a menos na rua)' : 'encaixes'}</span></div>
          {!admin && <div><b>{n('PENDENTE')}</b><span>aguardando</span></div>}
          <div><b>{n('RECUSADA')}</b><span>recusados</span></div>
          <div><b>{n('CANCELADA')}</b><span>cancelados</span></div>
          {admin && <div><b>{viagens.filter(s => s.modo === 'LEVA_BUSCA').length}</b><span>leva e busca</span></div>}
          <div><b>{fmtH(horas)}</b><span>de carro em uso</span></div>
          {admin && <div><b>{mediaResp === null ? '—' : fmtResp(mediaResp)}</b><span>tempo médio de resposta</span></div>}
        </div>
      </div>

      {lista.length === 0 ? <div className="painel vazio"><b>Nenhum pedido nesse período</b>Escolha outro período acima.</div> : (<>
        <div className="rel-grade">
          {admin && <div className="painel"><h2>Uso por veículo</h2><Barras itens={porVeic} fmt={fmtH} extra={i => plural(i.n, 'viagem', 'viagens')} /></div>}
          {admin && <div className="painel"><h2>Viagens por motorista</h2><Barras itens={porMot} fmt={v => plural(v, 'viagem', 'viagens')} extra={i => `${fmtH(i.h)} ao volante`} /></div>}
          {admin && (
            <div className="painel">
              <div className="painel-cab">
                <h2>Pedidos por {agrup === 'setor' ? 'setor' : 'pessoa'}</h2>
                <div className="seg nao-imprimir">
                  <button className={agrup === 'setor' ? 'ativo' : ''} onClick={() => setAgrup('setor')}>Setor</button>
                  <button className={agrup === 'pessoa' ? 'ativo' : ''} onClick={() => setAgrup('pessoa')}>Pessoa</button>
                </div>
              </div>
              <Barras itens={porQuem} limite={10} fmt={v => plural(v, 'pedido', 'pedidos')} extra={i => plural(i.a, 'atendido', 'atendidos')} />
            </div>
          )}
          <div className="painel"><h2>Destinos mais frequentes</h2><Barras itens={destinos} limite={8} fmt={v => plural(v, 'ida', 'idas')} /></div>
          {admin && <div className="painel"><h2>Viagens por dia da semana</h2><Barras itens={dias} fmt={v => plural(v, 'viagem', 'viagens')} /></div>}
          {!admin && meses.length > 1 && <div className="painel"><h2>Pedidos por mês</h2><Barras itens={meses} fmt={v => plural(v, 'pedido', 'pedidos')} /></div>}
        </div>

        <div className="painel">
          <h2>{admin ? 'Viagens agendadas no período' : 'Seus pedidos no período'}</h2>
          {(admin ? aprov : lista).length === 0 ? <p className="dica" style={{ color: 'var(--muted)', margin: 0 }}>Nenhuma viagem agendada no período.</p> : (
            <div className="tabela-rolagem"><table className="tabela">
              <thead><tr><th>Data</th><th>Horário</th><th>Destino</th>{admin ? <><th>Solicitante</th><th>Veículo</th><th>Motorista</th></> : <><th>Situação</th><th>Veículo e motorista</th></>}</tr></thead>
              <tbody>{(admin ? aprov : lista).map(s => (
                <tr key={s.id}>
                  <td style={{ whiteSpace: 'nowrap' }}>{fmtCurta(s.data)}</td>
                  <td>{textoHorario(s)}{s.tipo === 'ENCAIXE' ? ` (encaixe na #${s.encaixeDe})` : ''}</td>
                  <td>{s.destino}</td>
                  {admin
                    ? <><td>{s.solicitante}</td><td>{s.placa || '—'}</td><td>{s.motorista || 'A definir'}</td></>
                    : <><td><span className={'pill ' + s.status}>{STATUS[s.status]}</span></td><td>{AGENDADA(s) ? `${s.placa || '—'}, ${s.motorista || 'motorista a definir'}` : '—'}</td></>}
                </tr>))}</tbody>
            </table></div>
          )}
        </div>
      </>)}
    </>
  );
}

function SenhaModal({ fechar }) {
  const aviso = useAviso();
  const [f, setF] = useState({ atual: '', nova: '', conf: '' });
  const [enviando, setEnviando] = useState(false);
  const salvar = async e => {
    e.preventDefault();
    if (f.nova !== f.conf) return aviso('erro', 'A confirmação não bate com a nova senha.');
    setEnviando(true);
    try { await api('alterarSenha', { atual: f.atual, nova: f.nova }); aviso('ok', 'Senha alterada.'); fechar(); }
    catch (err) { aviso('erro', err.message); } finally { setEnviando(false); }
  };
  return (
    <Modal titulo="Trocar senha" fechar={fechar}>
      <form onSubmit={salvar}>
        <div className="campo"><label htmlFor="sa">Senha atual</label><input id="sa" type="password" value={f.atual} onChange={e => setF({ ...f, atual: e.target.value })} /></div>
        <div className="campo"><label htmlFor="sn2">Nova senha</label><input id="sn2" type="password" value={f.nova} onChange={e => setF({ ...f, nova: e.target.value })} /></div>
        <div className="campo"><label htmlFor="sc">Repita a nova senha</label><input id="sc" type="password" value={f.conf} onChange={e => setF({ ...f, conf: e.target.value })} /></div>
        <div className="acoes-fim"><button type="button" className="btn contorno" onClick={fechar}>Voltar</button><button className="btn prim" disabled={enviando}>{enviando ? 'Salvando…' : 'Trocar senha'}</button></div>
      </form>
    </Modal>
  );
}


/* ============================ app ============================ */
function App() {
  const [aviso, setAviso] = useState(null);
  const avisar = useCallback((tipo, msg) => setAviso({ tipo, msg, k: Date.now() }), []);
  const [usuario, setUsuario] = useState(undefined);
  const [tela, setTela] = useState(null);
  const [diaInicial, setDiaInicial] = useState(null);
  const [editando, setEditando] = useState(null);
  const [encaixe, setEncaixe] = useState(null);
  const [solAberta, setSolAberta] = useState(null);
  const [versao, setVersao] = useState(0);
  const [pendentes, setPendentes] = useState(0);
  const [cadPend, setCadPend] = useState(0);
  const [senha, setSenha] = useState(false);
  const [nov, setNov] = useState({ novos: 0, itens: [] });
  const [mostrarNov, setMostrarNov] = useState(false);

  const buscarNov = useCallback(abrir => api('novidades').then(d => { setNov(d); if (abrir && d.novos) setMostrarNov(true); }).catch(() => { }), []);

  useEffect(() => {
    if (!TOKEN) { setUsuario(null); return; }
    api('me').then(setUsuario).catch(() => { salvarToken(null); setUsuario(null); });
  }, []);
  useEffect(() => {
    const f = () => { salvarToken(null); setUsuario(null); avisar('erro', 'Sua sessão terminou. Entre novamente.'); };
    window.addEventListener('agv-sessao', f); return () => window.removeEventListener('agv-sessao', f);
  }, []);
  useEffect(() => {
    if (!usuario) return;
    setTela(usuario.tipo === 'admin' ? 'pedidos' : 'nova');
    if (usuario.tipo === 'admin') {
      api('listarSolicitacoes').then(l => setPendentes(contarAlertas(l))).catch(() => { });
      api('usuarios').then(l => setCadPend(l.filter(u => u.pendente).length)).catch(() => { });
    }
    else buscarNov(true);
  }, [usuario && usuario.id]);
  useEffect(() => {
    if (!usuario || usuario.tipo === 'admin') return;
    const f = () => { if (document.visibilityState === 'visible') buscarNov(true); };
    document.addEventListener('visibilitychange', f); return () => document.removeEventListener('visibilitychange', f);
  }, [usuario && usuario.id]);
  useEffect(() => { window.scrollTo(0, 0); }, [tela]);

  const sair = () => { salvarToken(null); setUsuario(null); setTela(null); setNov({ novos: 0, itens: [] }); setMostrarNov(false); };
  const ir = t => { setEditando(null); setDiaInicial(null); setEncaixe(null); setTela(t); };
  const pedirEncaixe = info => { setEditando(null); setEncaixe(info); setTela('encaixe'); };

  if (!usuario) return (
    <AvisoCtx.Provider value={avisar}>
      {DEMO && usuario === null && <div className="demo" style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 5 }}>Modo demonstração: dados de exemplo, nada é salvo.</div>}
      {usuario === undefined ? <Carregando /> : <Login entrar={setUsuario} />}
      <Aviso key={aviso && aviso.k} aviso={aviso} fechar={() => setAviso(null)} />
    </AvisoCtx.Provider>
  );

  if (usuario.trocarSenha) return (
    <AvisoCtx.Provider value={avisar}>
      <PrimeiroAcesso usuario={usuario} pronto={setUsuario} sair={sair} />
      <Aviso key={aviso && aviso.k} aviso={aviso} fechar={() => setAviso(null)} />
    </AvisoCtx.Provider>
  );

  const admin = usuario.tipo === 'admin';
  const menu = admin
    ? [['pedidos', 'Pedidos', I.pedidos, pendentes], ['agenda', 'Agenda', I.agenda], ['mensagem', 'Mensagem', I.zap], ['relatorios', 'Relatórios', I.grafico], ['cadastros', 'Cadastros', I.carro, cadPend]]
    : [['nova', 'Pedir carro', I.mais], ['agenda', 'Agenda', I.agenda], ['minhas', 'Meus pedidos', I.lista], ['avisos', 'Avisos', I.sino, nov.novos], ['relatorios', 'Relatórios', I.grafico]];
  const telaMenu = tela === 'encaixe' ? 'agenda' : tela === 'agendar' ? 'pedidos' : tela;

  let conteudo;
  if (tela === 'agendar' && admin) conteudo = <FormSolicitacao key={'adm' + (diaInicial || '')} admin usuario={usuario} inicial={diaInicial}
    cancelar={() => ir('pedidos')} concluir={() => { setVersao(v => v + 1); ir('agenda'); }} />;
  else if (tela === 'nova') conteudo = <FormSolicitacao key={(editando ? editando.id : 'n') + (diaInicial || '')} inicial={diaInicial} editando={editando}
    cancelar={editando ? () => ir('minhas') : null} concluir={() => ir('minhas')} pedirEncaixe={pedirEncaixe} />;
  else if (tela === 'encaixe' && encaixe) conteudo = <FormEncaixe viagem={encaixe} concluir={() => ir('minhas')} cancelar={() => ir('agenda')} />;
  else if (tela === 'agenda') conteudo = <Agenda key={versao} usuario={usuario} pedirNoDia={d => { ir(admin ? 'agendar' : 'nova'); setDiaInicial(d); }} abrirSol={setSolAberta} pedirEncaixe={pedirEncaixe} />;
  else if (tela === 'minhas') conteudo = <Minhas editar={s => { setEditando(s); setTela('nova'); }} novo={() => ir('nova')} />;
  else if (tela === 'avisos') conteudo = <Avisos onVisto={() => setNov(n => ({ ...n, novos: 0 }))} irPedidos={() => ir('minhas')} />;
  else if (tela === 'relatorios') conteudo = <Relatorios key={versao} admin={admin} />;
  else if (tela === 'pedidos') conteudo = <Pedidos versao={versao} abrirSol={setSolAberta} setPendentes={setPendentes} agendar={() => ir('agendar')} />;
  else if (tela === 'mensagem') conteudo = <MensagemDia key={versao} />;
  else if (tela === 'cadastros') conteudo = <Cadastros eu={usuario} inicial={cadPend ? 'usuarios' : 'veiculos'} abrirSol={setSolAberta} />;
  else conteudo = <Carregando />;

  return (
    <AvisoCtx.Provider value={avisar}>
      <div className="app">
        {DEMO && <div className="demo">Modo demonstração: dados de exemplo, nada é salvo.</div>}
        <header className="topo">
          <div className="topo-in">
            <div className="marca"><Logo /><div><b>Agenda de veículos</b><small>SEME</small></div></div>
            <div className="quem">
              <div className="quem-nome">{usuario.nome.split(' ')[0]}<span>{admin ? 'Administrador' : usuario.setor || 'Solicitante'}</span></div>
              <button className="icone-btn" onClick={() => setSenha(true)} aria-label="Trocar senha" title="Trocar senha">{I.chave}</button>
              <button className="icone-btn" onClick={sair} aria-label="Sair" title="Sair">{I.sair}</button>
            </div>
          </div>
          <nav className="nav-desk" aria-label="Menu">
            {menu.map(([k, rot, ic, b]) => <button key={k} className={telaMenu === k ? 'ativo' : ''} aria-current={telaMenu === k ? 'page' : undefined} onClick={() => ir(k)}>{rot}{b ? <span className="badge">{b}</span> : null}</button>)}
          </nav>
        </header>
        <main className="corpo">{conteudo}</main>
        <nav className="nav-mob" aria-label="Menu">
          {menu.map(([k, rot, ic, b]) => (
            <button key={k} className={telaMenu === k ? 'ativo' : ''} aria-current={telaMenu === k ? 'page' : undefined} onClick={() => ir(k)}>
              <span>{ic}{b ? <span className="badge">{b}</span> : null}</span>{rot}
            </button>
          ))}
        </nav>
      </div>
      {solAberta && <DetalheAdmin id={solAberta} fechar={() => setSolAberta(null)} mudou={() => setVersao(v => v + 1)} />}
      {senha && <SenhaModal fechar={() => setSenha(false)} />}
      {mostrarNov && <NovidadesModal nov={nov} irPedidos={() => ir('minhas')}
        fechar={() => { setMostrarNov(false); setNov(n => ({ novos: 0, itens: n.itens.map(i => ({ ...i, novo: false })) })); }} />}
      <Aviso key={aviso && aviso.k} aviso={aviso} fechar={() => setAviso(null)} />
    </AvisoCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
