<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<!-- Cópia do Code.gs usada SOMENTE no modo demonstração (quando CONFIG.API_URL está vazio). -->
<script type="text/plain" id="backend-demo">
/*****************************************************************
 * AGENDA DE VEÍCULOS — SEME
 * Backend em Google Apps Script (planilha + Google Agenda + e-mail)
 *
 * COMO PUBLICAR
 * 1. Crie uma planilha nova no Google Sheets (na conta que vai rodar
 *    o sistema) e abra Extensões > Apps Script.
 * 2. Apague o conteúdo do arquivo Code.gs e cole este arquivo inteiro.
 * 3. Preencha o bloco CONFIG abaixo (principalmente CALENDAR_ID).
 *    - O ID da agenda fica no Google Agenda > Configurações da agenda
 *      dos carros > "Integrar agenda" > "ID da agenda".
 *    - Se a agenda estiver na conta institucional e o script rodar na
 *      conta pessoal: compartilhe a agenda com a conta pessoal com a
 *      permissão "Fazer alterações nos eventos".
 * 4. Em Configurações do projeto (engrenagem), defina o fuso horário
 *    "(GMT-03:00) São Paulo".
 * 5. Selecione a função setup no topo e clique em Executar. Autorize
 *    os acessos pedidos (planilha, agenda, e-mail e execução agendada).
 *    O setup cria as abas, o lembrete diário das 7h e o primeiro
 *    administrador:   login: admin    senha: admin123   (troque depois)
 * 6. Implantar > Nova implantação > Tipo "App da Web"
 *        Executar como: Eu
 *        Quem pode acessar: Qualquer pessoa
 *    Copie a URL gerada (termina em /exec) e cole em CONFIG.API_URL
 *    no arquivo index.html.
 * 7. Sempre que alterar este código: Implantar > Gerenciar implantações
 *    > editar (lápis) > Versão: "Nova versão" > Implantar.
 *
 * LIMITE DE E-MAILS: contas Google pessoais enviam até 100 e-mails
 * por dia via Apps Script (Workspace: 1.500).
 *****************************************************************/

const CONFIG = {
  CALENDAR_ID: 'COLE_AQUI_O_ID_DA_AGENDA_DOS_CARROS',
  TIMEZONE: 'America/Sao_Paulo',
  NOME_SISTEMA: 'Agenda de Veículos — SEME',
  SIGLA_EMAIL: 'Veículos SEME',
  // Link do sistema que aparece no botão dos e-mails (GitHub Pages)
  URL_SISTEMA: 'https://SEU-USUARIO.github.io/agenda-veiculos/',
  // E-mail extra que recebe avisos de novos pedidos (além dos admins)
  EMAIL_ADMIN_EXTRA: '',
  VALIDADE_SESSAO_DIAS: 7,
  // Lembrete diário: avisa sobre pré-agendamentos sem motorista nos próximos N dias
  DIAS_LEMBRETE_MOTORISTA: 3,
  HORA_LEMBRETE: 7,
  // Leva e busca: por quantos minutos o carro fica reservado a partir da hora de levar e da hora de buscar
  RESERVA_LEVA_BUSCA_MIN: 30,
  // Senha de quem se cadastra (ou tem a senha zerada). A pessoa troca no primeiro acesso.
  SENHA_PADRAO: 'Abc123',
};

const ABAS = {
  Usuarios: ['ID', 'Login', 'SenhaHash', 'Nome', 'Email', 'Setor', 'Tipo', 'Ativo', 'CriadoEm', 'VistoEm', 'Telefone', 'TrocarSenha',
    'CodigoSenha', 'CodigoValidade', 'CodigoTentativas'],
  Veiculos: ['ID', 'Placa', 'Modelo', 'Lugares', 'Ativo', 'Motorista'],
  Motoristas: ['ID', 'Nome', 'Telefone', 'Ativo'],
  Bloqueios: ['ID', 'Tipo', 'VeiculoID', 'Placa', 'Motorista', 'Inicio', 'Fim', 'Motivo', 'EventoID', 'CriadoEm', 'CriadoPor'],
  Solicitacoes: ['ID', 'CriadoEm', 'AtualizadoEm', 'UsuarioID', 'Solicitante', 'Email', 'Setor',
    'Data', 'HoraIda', 'HoraRetorno', 'Destino', 'Passageiros', 'Finalidade', 'Urgente',
    'Justificativa', 'Status', 'VeiculoID', 'Placa', 'Motorista', 'EventoID', 'ObsAdmin',
    'Proposta', 'Historico', 'Tipo', 'EncaixeDe', 'Modo', 'Trajeto'],
};

const ACOES_SO_LEITURA = ['me', 'disponibilidade', 'minhasSolicitacoes', 'listarSolicitacoes',
  'resumoDia', 'veiculos', 'usuarios', 'novidades', 'motoristas', 'bloqueios'];

// Situações de um pedido
const ST = {
  PENDENTE: 'PENDENTE',                    // aguardando a administração
  ALTERACAO: 'ALTERACAO_PENDENTE',         // já agendado, com pedido de alteração
  PRE: 'PRE_AGENDADA',                     // carro reservado, motorista a definir
  CONFIRMADA: 'APROVADA',                  // carro e motorista definidos
  RECUSADA: 'RECUSADA',
  CANCELADA: 'CANCELADA',
};
const AGENDADAS = [ST.PRE, ST.CONFIRMADA];

/* ============================ SETUP ============================ */

function setup() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  ss.setSpreadsheetTimeZone(CONFIG.TIMEZONE);
  Object.keys(ABAS).forEach(function (nome) {
    let sh = ss.getSheetByName(nome);
    if (!sh) sh = ss.insertSheet(nome);
    const cab = ABAS[nome];
    if (sh.getMaxColumns() < cab.length) sh.insertColumnsAfter(sh.getMaxColumns(), cab.length - sh.getMaxColumns());
    sh.getRange(1, 1, sh.getMaxRows(), cab.length).setNumberFormat('@');
    sh.getRange(1, 1, 1, cab.length).setValues([cab]).setFontWeight('bold');
    sh.setFrozenRows(1);
  });
  const padrao = ss.getSheetByName('Página1') || ss.getSheetByName('Sheet1');
  if (padrao && ss.getSheets().length > 1) ss.deleteSheet(padrao);

  segredo_();

  if (!lerTodos_('Usuarios').some(function (u) { return u.Tipo === 'admin'; })) {
    const id = 'U' + Utilities.getUuid().slice(0, 8);
    inserir_('Usuarios', {
      ID: id, Login: 'ADMIN', SenhaHash: hashSenha_(id, 'admin123'), Nome: 'ADMINISTRADOR',
      Email: Session.getEffectiveUser().getEmail(), Setor: 'SEME', Tipo: 'admin', Ativo: 'SIM',
      CriadoEm: agora_(), TrocarSenha: 'NAO',
    });
    Logger.log('Administrador criado. Login: admin / senha: admin123');
  }

  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'lembreteDiario') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('lembreteDiario').timeBased().everyDays(1).atHour(CONFIG.HORA_LEMBRETE).create();

  const cal = agenda_();
  Logger.log('Agenda conectada: ' + cal.getName());
  Logger.log('E-mails restantes hoje: ' + MailApp.getRemainingDailyQuota());
}

/* E-mail diário para os administradores: pré-agendamentos sem motorista chegando e pedidos aguardando. */
function lembreteDiario() {
  const hoje = hoje_();
  const limite = fmt_(new Date(Date.now() + CONFIG.DIAS_LEMBRETE_MOTORISTA * 864e5), 'yyyy-MM-dd');
  const sols = lerTodos_('Solicitacoes');
  const pre = sols.filter(function (s) {
    return s.Status === ST.PRE && s.Tipo !== 'ENCAIXE' && s.Data >= hoje && s.Data <= limite;
  }).sort(function (a, b) { return (a.Data + a.HoraIda).localeCompare(b.Data + b.HoraIda); });
  const pend = sols.filter(function (s) { return s.Status === ST.PENDENTE || s.Status === ST.ALTERACAO; }).length;
  if (!pre.length && !pend) return;

  const linhas = pre.map(function (s) {
    return '<li style="margin-bottom:6px"><b>' + esc_(dataExtenso_(s.Data)) + ', ' + esc_(textoHorario_(s)) + '</b><br>' +
      esc_(s.Destino) + ' — ' + esc_(s.Solicitante) + (s.Placa ? ' — veículo ' + esc_(s.Placa) : '') + ' (#' + s.ID + ')</li>';
  }).join('');
  const html = '<div style="font-family:Arial,sans-serif;max-width:560px;color:#16282b">' +
    '<h2 style="color:#094a3e">Bom dia! Agenda de veículos</h2>' +
    (pre.length ? '<p><b>' + pre.length + ' pré-agendamento(s) sem motorista</b> nos próximos ' + CONFIG.DIAS_LEMBRETE_MOTORISTA + ' dias:</p><ul>' + linhas + '</ul>' : '') +
    (pend ? '<p><b>' + pend + ' pedido(s)</b> aguardando sua aprovação.</p>' : '') +
    '<p><a href="' + CONFIG.URL_SISTEMA + '" style="background:#0e6b5a;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;display:inline-block">Abrir o sistema</a></p></div>';
  enviar_(emailsAdmins_(), (pre.length ? pre.length + ' pré-agendamento(s) sem motorista' : pend + ' pedido(s) aguardando'), html);
}

/* ============================ HTTP ============================ */

function doGet() {
  return json_({ ok: true, dados: 'API da Agenda de Veículos no ar.' });
}

function doPost(e) {
  let req = {};
  let lock = null;
  try {
    req = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    if (ACOES_SO_LEITURA.indexOf(req.action) === -1) {
      lock = LockService.getScriptLock();
      lock.waitLock(25000);
    }
    return json_({ ok: true, dados: rotear_(req) });
  } catch (err) {
    return json_({ ok: false, erro: (err && err.message) || String(err), codigo: (err && err.codigo) || 'ERRO' });
  } finally {
    if (lock) try { lock.releaseLock(); } catch (x) { }
  }
}

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function rotear_(r) {
  if (r.action === 'login') return acaoLogin_(r);
  if (r.action === 'solicitarCadastro') return acaoSolicitarCadastro_(r);
  if (r.action === 'esqueciSenha') return acaoEsqueciSenha_(r);
  if (r.action === 'redefinirSenha') return acaoRedefinirSenha_(r);

  const u = validarToken_(r.token);
  const admin = u.Tipo === 'admin';
  function soAdmin() {
    if (!admin) throw erro_('PERMISSAO', 'Apenas o administrador pode fazer isso.');
  }

  switch (r.action) {
    case 'me': return usuarioPublico_(u);
    case 'alterarSenha': return acaoAlterarSenha_(u, r);
    case 'novidades': return acaoNovidades_(u);
    case 'marcarVisto': u.VistoEm = agoraS_(); atualizar_('Usuarios', u); return true;
    case 'veiculos': return acaoVeiculos_(admin);
    case 'disponibilidade': return acaoDisponibilidade_(u, r, admin);
    case 'criarSolicitacao': return acaoCriar_(u, r);
    case 'minhasSolicitacoes':
      return lerTodos_('Solicitacoes').filter(function (s) { return s.UsuarioID === u.ID; })
        .map(solPublica_).sort(ordenarSols_);
    case 'alterarSolicitacao': return acaoAlterar_(u, r, admin);
    case 'cancelarSolicitacao': return acaoCancelar_(u, r, admin);
    case 'listarSolicitacoes': soAdmin(); return acaoListar_();
    case 'aprovar': soAdmin(); return acaoAprovar_(u, r);
    case 'agendarDireto': soAdmin(); return acaoAgendarDireto_(u, r);
    case 'recusar': soAdmin(); return acaoRecusar_(u, r);
    case 'resumoDia': soAdmin(); return acaoResumoDia_(r);
    case 'bloqueios': soAdmin(); return lerTodos_('Bloqueios').map(bloqPublico_);
    case 'salvarBloqueio': soAdmin(); return acaoSalvarBloqueio_(u, r);
    case 'removerBloqueio': soAdmin(); return acaoRemoverBloqueio_(r);
    case 'salvarVeiculo': soAdmin(); return acaoSalvarVeiculo_(u, r);
    case 'removerVeiculo': soAdmin(); return acaoRemoverVeiculo_(r);
    case 'motoristas': soAdmin(); return lerTodos_('Motoristas').map(motPublico_);
    case 'salvarMotorista': soAdmin(); return acaoSalvarMotorista_(r);
    case 'removerMotorista': soAdmin(); return acaoRemoverMotorista_(r);
    case 'usuarios': soAdmin(); return lerTodos_('Usuarios').map(usuarioPublico_);
    case 'salvarUsuario': soAdmin(); return acaoSalvarUsuario_(u, r);
    case 'removerUsuario': soAdmin(); return acaoRemoverUsuario_(u, r);
    case 'decidirCadastro': soAdmin(); return acaoDecidirCadastro_(u, r);
    default: throw erro_('ACAO', 'Ação desconhecida: ' + r.action);
  }
}

/* ============================ PLANILHA ============================ */

function aba_(nome) {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(nome);
  if (!sh) throw erro_('PLANILHA', 'A aba "' + nome + '" não existe. Rode a função setup() no Apps Script.');
  return sh;
}

function lerTodos_(nome) {
  const valores = aba_(nome).getDataRange().getValues();
  if (valores.length < 2) return [];
  const cab = valores[0];
  const lista = [];
  for (let i = 1; i < valores.length; i++) {
    const o = { _linha: i + 1 };
    cab.forEach(function (c, j) { o[c] = norm_(c, valores[i][j]); });
    if (o.ID) lista.push(o);
  }
  return lista;
}

function norm_(col, v) {
  if (v instanceof Date) {
    if (col === 'Data') return fmt_(v, 'yyyy-MM-dd');
    if (/^Hora/.test(col)) return fmt_(v, 'HH:mm');
    return fmt_(v, 'yyyy-MM-dd HH:mm');
  }
  if (v === null || v === undefined) return '';
  let s = String(v);
  if (s.charAt(0) === "'") s = s.slice(1);
  return s;
}

function celula_(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  // força texto (evita o Sheets converter datas/horas e bloqueia fórmulas)
  return /^[0-9=+\-@]/.test(s) ? "'" + s : s;
}

function cabecalho_(nome) {
  return ABAS[nome];
}

function inserir_(nome, obj) {
  aba_(nome).appendRow(cabecalho_(nome).map(function (c) { return celula_(obj[c]); }));
}

function atualizar_(nome, obj) {
  const cab = cabecalho_(nome);
  aba_(nome).getRange(obj._linha, 1, 1, cab.length)
    .setValues([cab.map(function (c) { return celula_(obj[c]); })]);
}

function acharSol_(id) {
  const s = lerTodos_('Solicitacoes').find(function (x) { return x.ID === String(id); });
  if (!s) throw erro_('NAO_ENCONTRADO', 'Solicitação #' + id + ' não encontrada.');
  return s;
}

function proximoId_() {
  let max = 0;
  lerTodos_('Solicitacoes').forEach(function (s) {
    const n = parseInt(s.ID, 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return ('000' + (max + 1)).slice(-4);
}

/* ============================ SEGURANÇA ============================ */

function erro_(codigo, msg) {
  const e = new Error(msg);
  e.codigo = codigo;
  return e;
}

function segredo_() {
  const p = PropertiesService.getScriptProperties();
  let s = p.getProperty('SEGREDO');
  if (!s) {
    s = Utilities.getUuid() + Utilities.getUuid();
    p.setProperty('SEGREDO', s);
  }
  return s;
}

function hex_(bytes) {
  return bytes.map(function (b) { return ('0' + (b & 0xff).toString(16)).slice(-2); }).join('');
}

function hashSenha_(id, senha) {
  return hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, id + '::' + senha, Utilities.Charset.UTF_8));
}

function assinar_(txt) {
  return hex_(Utilities.computeHmacSha256Signature(txt, segredo_()));
}

function gerarToken_(uid) {
  const corpo = uid + '|' + (Date.now() + CONFIG.VALIDADE_SESSAO_DIAS * 864e5);
  return Utilities.base64EncodeWebSafe(corpo) + '.' + assinar_(corpo);
}

function validarToken_(token) {
  if (!token) throw erro_('SESSAO', 'Faça login para continuar.');
  const partes = String(token).split('.');
  let corpo;
  try {
    corpo = Utilities.newBlob(Utilities.base64DecodeWebSafe(partes[0])).getDataAsString();
  } catch (e) {
    throw erro_('SESSAO', 'Sessão inválida. Entre novamente.');
  }
  if (assinar_(corpo) !== partes[1]) throw erro_('SESSAO', 'Sessão inválida. Entre novamente.');
  const dados = corpo.split('|');
  if (Date.now() > Number(dados[1])) throw erro_('SESSAO', 'Sua sessão expirou. Entre novamente.');
  const u = lerTodos_('Usuarios').find(function (x) { return x.ID === dados[0]; });
  if (!u || u.Ativo === 'NAO' || u.Ativo === 'PENDENTE') throw erro_('SESSAO', 'Usuário desativado. Fale com a administração.');
  return u;
}

function conferirSenha_(u, senha) {
  const guardada = String(u.SenhaHash || '');
  if (/^[0-9a-f]{64}$/.test(guardada)) return guardada === hashSenha_(u.ID, senha);
  // senha digitada direto na planilha (texto puro): aceita e converte para hash
  if (guardada && guardada === senha) {
    u.SenhaHash = hashSenha_(u.ID, senha);
    atualizar_('Usuarios', u);
    return true;
  }
  return false;
}

function usuarioPublico_(u) {
  return {
    id: u.ID, login: u.Login, nome: u.Nome, email: u.Email, setor: u.Setor, tipo: u.Tipo, telefone: u.Telefone || '',
    ativo: u.Ativo !== 'NAO' && u.Ativo !== 'PENDENTE', pendente: u.Ativo === 'PENDENTE', trocarSenha: u.TrocarSenha === 'SIM',
    criadoEm: u.CriadoEm,
  };
}

function acaoLogin_(r) {
  const login = String(r.login || '').trim().toLowerCase();
  const u = lerTodos_('Usuarios').find(function (x) { return String(x.Login).toLowerCase() === login; });
  if (!u || !conferirSenha_(u, String(r.senha || ''))) throw erro_('LOGIN', 'Login ou senha incorretos.');
  if (u.Ativo === 'PENDENTE') throw erro_('LOGIN', 'Seu cadastro como administrador ainda aguarda aprovação. Você recebe um e-mail quando for liberado.');
  if (u.Ativo === 'NAO') throw erro_('LOGIN', 'Este usuário está desativado. Fale com a administração.');
  return { token: gerarToken_(u.ID), usuario: usuarioPublico_(u) };
}

function acaoAlterarSenha_(u, r) {
  // no primeiro acesso (senha padrão) não precisa informar a senha atual: a pessoa acabou de entrar com ela
  if (u.TrocarSenha !== 'SIM' && !conferirSenha_(u, String(r.atual || ''))) throw erro_('SENHA', 'A senha atual está incorreta.');
  const nova = String(r.nova || '');
  if (nova.length < 6) throw erro_('SENHA', 'A nova senha precisa ter pelo menos 6 caracteres.');
  if (nova.toLowerCase() === String(CONFIG.SENHA_PADRAO).toLowerCase()) throw erro_('SENHA', 'Escolha uma senha diferente da senha padrão.');
  u.SenhaHash = hashSenha_(u.ID, nova);
  u.TrocarSenha = 'NAO';
  atualizar_('Usuarios', u);
  return usuarioPublico_(u);
}

/* ============================ DATAS ============================ */

function fmt_(d, padrao) {
  return Utilities.formatDate(d, CONFIG.TIMEZONE, padrao);
}

function agora_() {
  return fmt_(new Date(), 'yyyy-MM-dd HH:mm');
}

function agoraS_() {
  return fmt_(new Date(), 'yyyy-MM-dd HH:mm:ss');
}

function hoje_() {
  return fmt_(new Date(), 'yyyy-MM-dd');
}

function dt_(data, hora) {
  return Utilities.parseDate(data + ' ' + (hora || '00:00'), CONFIG.TIMEZONE, 'yyyy-MM-dd HH:mm');
}

function dataExtenso_(data) {
  const dias = ['', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado', 'domingo'];
  const d = dt_(data, '12:00');
  return dias[Number(fmt_(d, 'u'))] + ', ' + fmt_(d, 'dd/MM/yyyy');
}

/* ============================ AGENDA ============================ */

function agenda_() {
  let cal = null;
  try { cal = CalendarApp.getCalendarById(CONFIG.CALENDAR_ID); } catch (e) { }
  if (!cal) throw erro_('AGENDA', 'Não foi possível acessar o Google Agenda. Confira o CALENDAR_ID no Code.gs e se a agenda foi compartilhada com a conta que roda o sistema.');
  return cal;
}

function normPlaca_(p) {
  return String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function minDe_(h) {
  const p = String(h || '00:00').split(':');
  return Number(p[0]) * 60 + Number(p[1]);
}

function hm_(m) {
  m = Math.max(0, Math.min(1439, Math.round(m)));
  return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2);
}

/*
 * Intervalos em que o pedido prende carro e motorista (minutos do dia).
 * - Motorista acompanha: da saída até o retorno.
 * - Leva e busca: um bloco a partir da hora de levar e outro a partir da hora de buscar,
 *   cada um com CONFIG.RESERVA_LEVA_BUSCA_MIN minutos. Entre os dois, carro e motorista ficam livres.
 */
function blocos_(s) {
  const a = minDe_(s.HoraIda), b = minDe_(s.HoraRetorno);
  if (s.Modo !== 'LEVA_BUSCA') return [{ a: a, b: b, perna: 'total' }];
  const d = Number(CONFIG.RESERVA_LEVA_BUSCA_MIN) || 30;
  const ida = { a: a, b: a + d, perna: 'ida' };
  const volta = { a: b, b: Math.min(1439, b + d), perna: 'volta' };
  if (volta.a <= ida.b) return [{ a: a, b: volta.b, perna: 'total' }];
  return [ida, volta];
}

function textoHorario_(s) {
  if (s.Modo === 'LEVA_BUSCA') return 'leva às ' + s.HoraIda + ' e busca às ' + s.HoraRetorno;
  return s.HoraIda + ' às ' + s.HoraRetorno;
}

function eventosPeriodo_(ini, fim) {
  return agenda_().getEvents(ini, fim).map(function (ev) {
    const diaTodo = ev.isAllDayEvent();
    const s = diaTodo ? ev.getAllDayStartDate() : ev.getStartTime();
    const e = diaTodo ? ev.getAllDayEndDate() : ev.getEndTime();
    const titulo = ev.getTitle() || '';
    const m = titulo.match(/\[([A-Za-z0-9-]{6,9})\]/);
    let solId = '', perna = '', bloqId = '';
    try { solId = ev.getTag('solicitacaoId') || ''; perna = ev.getTag('perna') || ''; bloqId = ev.getTag('bloqueioId') || ''; } catch (x) { }
    return {
      id: ev.getId(), inicio: fmt_(s, 'yyyy-MM-dd HH:mm'), fim: fmt_(e, 'yyyy-MM-dd HH:mm'),
      ini: s.getTime(), fimMs: e.getTime(), diaTodo: diaTodo, titulo: titulo,
      local: ev.getLocation() || '', placa: m ? normPlaca_(m[1]) : '', solicitacaoId: solId, perna: perna, bloqueioId: bloqId,
    };
  });
}

function eventosDoDia_(data) {
  const a = dt_(data, '00:00');
  return eventosPeriodo_(a, new Date(a.getTime() + 864e5));
}

function veiculosAtivos_() {
  return lerTodos_('Veiculos').filter(function (v) { return v.Ativo !== 'NAO'; });
}

function maxSimultaneo_(evs, a, b) {
  const pts = [];
  evs.forEach(function (e) {
    pts.push([Math.max(e.ini, a), 1]);
    pts.push([Math.min(e.fimMs, b), -1]);
  });
  pts.sort(function (x, y) { return x[0] - y[0] || x[1] - y[1]; });
  let c = 0, m = 0;
  pts.forEach(function (p) { c += p[1]; if (c > m) m = c; });
  return m;
}

/*
 * Um intervalo está indisponível quando todos os veículos ativos já estão ocupados em
 * algum momento dele. Evento com placa no título ([ABC1D23]) ocupa aquele veículo;
 * evento sem placa (criado direto no Google Agenda) ocupa "algum" veículo.
 */
function conflitoCom_(eventos, veics, data, horaIda, horaRetorno, ignorarSolId) {
  const a = dt_(data, horaIda).getTime();
  const b = dt_(data, horaRetorno).getTime();
  const placasAtivas = veics.map(function (v) { return normPlaca_(v.Placa); });
  const sobrepostos = eventos.filter(function (e) {
    return e.ini < b && e.fimMs > a && !(ignorarSolId && e.solicitacaoId === ignorarSolId);
  });
  const placas = [];
  const semPlaca = [];
  sobrepostos.forEach(function (e) {
    if (e.placa && placasAtivas.indexOf(e.placa) > -1) {
      if (placas.indexOf(e.placa) === -1) placas.push(e.placa);
    } else semPlaca.push(e);
  });
  const capacidade = Math.max(1, veics.length);
  const total = placas.length + maxSimultaneo_(semPlaca, a, b);
  return { conflito: total >= capacidade, ocupados: Math.min(total, capacidade), capacidade: capacidade, placasOcupadas: placas, semPlaca: semPlaca.length };
}

function conflitoBlocos_(eventos, veics, data, blocos, ignorarSolId) {
  const res = { conflito: false, ocupados: 0, capacidade: Math.max(1, veics.length), placasOcupadas: [], semPlaca: 0 };
  blocos.forEach(function (bl) {
    const c = conflitoCom_(eventos, veics, data, hm_(bl.a), hm_(bl.b), ignorarSolId);
    if (c.conflito) res.conflito = true;
    res.ocupados = Math.max(res.ocupados, c.ocupados);
    res.semPlaca = Math.max(res.semPlaca, c.semPlaca);
    c.placasOcupadas.forEach(function (p) { if (res.placasOcupadas.indexOf(p) === -1) res.placasOcupadas.push(p); });
  });
  return res;
}

function encaixesDe_(sols, baseId, situacoes) {
  return sols.filter(function (x) {
    return x.Tipo === 'ENCAIXE' && x.EncaixeDe === baseId && (situacoes || AGENDADAS).indexOf(x.Status) > -1;
  });
}

function nPass_(s) {
  return String(s.Passageiros || '').split('\n').filter(String).length;
}

/* Resumo de uma viagem agendada, mostrado a quem consulta a agenda (inclusive para pedir encaixe). */
function infoViagem_(s, sols, veicPorPlaca) {
  const enc = encaixesDe_(sols, s.ID);
  const v = veicPorPlaca[s.Placa];
  const lugares = v ? Number(v.Lugares) || 0 : 0;
  const ocupados = nPass_(s) + enc.reduce(function (t, x) { return t + nPass_(x); }, 0);
  return {
    id: s.ID, solicitante: s.Solicitante, setor: s.Setor, destino: s.Destino, finalidade: s.Finalidade,
    passageiros: String(s.Passageiros || '').split('\n').filter(String), data: s.Data,
    horaIda: s.HoraIda, horaRetorno: s.HoraRetorno, modo: s.Modo || 'ACOMPANHA', trajeto: Number(s.Trajeto) || 0,
    placa: s.Placa, modelo: v ? v.Modelo : '', lugares: lugares, motorista: s.Motorista, status: s.Status,
    encaixes: enc.map(function (x) { return { solicitante: x.Solicitante, destino: x.Destino, pessoas: nPass_(x) }; }),
    vagas: lugares ? Math.max(0, lugares - 1 - ocupados) : null,
  };
}

function acaoDisponibilidade_(u, r, admin) {
  const inicio = String(r.inicio || hoje_());
  const fim = String(r.fim || inicio);
  const a = dt_(inicio, '00:00');
  const b = new Date(dt_(fim, '00:00').getTime() + 864e5);
  if (b - a > 63 * 864e5) throw erro_('PERIODO', 'Consulte no máximo 2 meses por vez.');

  const sols = lerTodos_('Solicitacoes');
  const porId = {};
  sols.forEach(function (s) { porId[s.ID] = s; });
  const veics = veiculosAtivos_();
  const veicPorPlaca = {};
  lerTodos_('Veiculos').forEach(function (v) { veicPorPlaca[normPlaca_(v.Placa)] = v; });

  const eventos = eventosPeriodo_(a, b).map(function (e) {
    const s = porId[e.solicitacaoId];
    return {
      id: e.id, inicio: e.inicio, fim: e.fim, diaTodo: e.diaTodo, placa: e.placa, perna: e.perna,
      solicitacaoId: s ? s.ID : '', titulo: s && !admin ? '' : e.titulo, local: s && !admin ? '' : e.local,
      meu: !!(s && s.UsuarioID === u.ID), info: s ? infoViagem_(s, sols, veicPorPlaca) : null, bloqueio: !!e.bloqueioId,
    };
  });

  const res = { eventos: eventos, veiculos: veics.map(veicPublico_) };
  if (admin) {
    res.bloqueios = bloqueiosEntre_(a.getTime(), b.getTime()).map(bloqPublico_);
    res.pendentes = sols.filter(function (s) {
      const d = dadosEfetivos_(s);
      return (s.Status === ST.PENDENTE || s.Status === ST.ALTERACAO) && d.Data >= inicio && d.Data <= fim;
    }).map(solPublica_);
  }
  return res;
}

function tituloEvento_(s, perna, nEncaixes) {
  return (s.Placa ? '[' + s.Placa + '] ' : '') + (s.Status === ST.PRE ? '(pré) ' : '') +
    (perna === 'ida' ? 'Levar: ' : perna === 'volta' ? 'Buscar: ' : '') +
    s.Destino + ' — ' + s.Solicitante + (nEncaixes ? ' +' + nEncaixes + ' encaixe(s)' : '');
}

function descricaoEvento_(s, encaixes) {
  const l = [
    'Solicitação #' + s.ID,
    'Solicitante: ' + s.Solicitante + (s.Setor ? ' (' + s.Setor + ')' : ''),
    'Destino: ' + s.Destino,
    s.Modo === 'LEVA_BUSCA'
      ? 'Leva e busca: leva às ' + s.HoraIda + ' e busca às ' + s.HoraRetorno + '. Entre a ida e a busca, carro e motorista ficam livres.'
      : 'Horário: ' + s.HoraIda + ' às ' + s.HoraRetorno + ' (motorista acompanha)',
    'Passageiros: ' + String(s.Passageiros).split('\n').join(', '),
  ];
  if (s.Finalidade) l.push('Finalidade: ' + s.Finalidade);
  l.push('Motorista: ' + (s.Motorista || 'a definir (pré-agendado)'));
  if (s.ObsAdmin) l.push('Observação: ' + s.ObsAdmin);
  (encaixes || []).forEach(function (x) {
    l.push('Encaixe #' + x.ID + ': ' + x.Solicitante + ' → ' + x.Destino + ' (' + String(x.Passageiros).split('\n').join(', ') + ')');
  });
  l.push('', 'Criado pelo sistema Agenda de Veículos. Para alterar, use o sistema.');
  return l.join('\n');
}

/* Cria ou atualiza os eventos (1 ou 2, conforme o modo) e devolve os IDs separados por vírgula. */
function gravarEventos_(s, sols) {
  const cal = agenda_();
  const enc = encaixesDe_(sols || lerTodos_('Solicitacoes'), s.ID);
  const bl = blocos_(s);
  const antigos = String(s.EventoID || '').split(',').filter(String).map(function (id) {
    try { return cal.getEventById(id); } catch (e) { return null; }
  }).filter(Boolean);
  const ids = [];
  bl.forEach(function (b, i) {
    const titulo = tituloEvento_(s, b.perna, enc.length);
    const ini = dt_(s.Data, hm_(b.a));
    const fim = dt_(s.Data, hm_(b.b));
    let ev = antigos[i];
    if (ev) {
      ev.setTitle(titulo);
      ev.setTime(ini, fim);
      ev.setLocation(s.Destino);
      ev.setDescription(descricaoEvento_(s, enc));
    } else {
      ev = cal.createEvent(titulo, ini, fim, { location: s.Destino, description: descricaoEvento_(s, enc) });
    }
    ev.setTag('solicitacaoId', s.ID);
    ev.setTag('perna', b.perna);
    ids.push(ev.getId());
  });
  antigos.slice(bl.length).forEach(function (ev) { try { ev.deleteEvent(); } catch (e) { } });
  return ids.join(',');
}

function apagarEventos_(s) {
  String(s.EventoID || '').split(',').filter(String).forEach(function (id) {
    try {
      const ev = agenda_().getEventById(id);
      if (ev) ev.deleteEvent();
    } catch (e) { console.warn('Não apagou evento: ' + e); }
  });
}

/* ============================ SOLICITAÇÕES ============================ */

function solPublica_(s) {
  let proposta = null, historico = [];
  try { proposta = s.Proposta ? JSON.parse(s.Proposta) : null; } catch (e) { }
  try { historico = s.Historico ? JSON.parse(s.Historico) : []; } catch (e) { }
  return {
    id: s.ID, criadoEm: s.CriadoEm, atualizadoEm: s.AtualizadoEm, usuarioId: s.UsuarioID,
    solicitante: s.Solicitante, email: s.Email, setor: s.Setor, data: s.Data,
    horaIda: s.HoraIda, horaRetorno: s.HoraRetorno, destino: s.Destino,
    passageiros: String(s.Passageiros || '').split('\n').filter(String),
    finalidade: s.Finalidade, urgente: s.Urgente === 'SIM', justificativa: s.Justificativa,
    status: s.Status, veiculoId: s.VeiculoID, placa: s.Placa, motorista: s.Motorista,
    eventoId: s.EventoID, obsAdmin: s.ObsAdmin, proposta: proposta, historico: historico,
    tipo: s.Tipo || 'NORMAL', encaixeDe: s.EncaixeDe, modo: s.Modo || 'ACOMPANHA', trajeto: Number(s.Trajeto) || 0,
  };
}

function ordenarSols_(a, b) {
  return (b.data + b.horaIda).localeCompare(a.data + a.horaIda);
}

function dadosEfetivos_(s) {
  if (s.Status === ST.ALTERACAO && s.Proposta) {
    try {
      const p = JSON.parse(s.Proposta);
      return { Data: p.data, HoraIda: p.horaIda, HoraRetorno: p.horaRetorno, Modo: p.modo, Trajeto: p.trajeto };
    } catch (e) { }
  }
  return { Data: s.Data, HoraIda: s.HoraIda, HoraRetorno: s.HoraRetorno, Modo: s.Modo, Trajeto: s.Trajeto };
}

function registrar_(s, u, acao) {
  let h = [];
  try { h = s.Historico ? JSON.parse(s.Historico) : []; } catch (e) { }
  h.push({ em: agoraS_(), por: u.Nome, porId: u.ID, acao: acao });
  s.Historico = JSON.stringify(h);
  s.AtualizadoEm = agora_();
}

function acharSolEm_(sols, id) {
  const s = sols.find(function (x) { return x.ID === String(id); });
  if (!s) throw erro_('NAO_ENCONTRADO', 'Solicitação #' + id + ' não encontrada.');
  return s;
}

function validarPedido_(r) {
  const p = {
    data: String(r.data || '').trim(),
    horaIda: String(r.horaIda || '').trim(),
    horaRetorno: String(r.horaRetorno || '').trim(),
    destino: up_(r.destino),
    passageiros: upLinhas_(r.passageiros),
    finalidade: up_(r.finalidade),
    urgente: !!r.urgente,
    justificativa: up_(r.justificativa),
    modo: r.modo === 'LEVA_BUSCA' ? 'LEVA_BUSCA' : 'ACOMPANHA',
    trajeto: Math.min(240, Math.max(10, Number(r.trajeto) || 30)),
  };
  const busca = p.modo === 'LEVA_BUSCA';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(p.data)) throw erro_('VALIDACAO', 'Informe a data.');
  if (!/^\d{2}:\d{2}$/.test(p.horaIda)) throw erro_('VALIDACAO', 'Informe o horário de saída.');
  if (!/^\d{2}:\d{2}$/.test(p.horaRetorno)) throw erro_('VALIDACAO', busca ? 'Informe o horário da busca.' : 'Informe o horário de retorno.');
  if (p.horaRetorno <= p.horaIda) throw erro_('VALIDACAO', busca ? 'A busca precisa ser depois da saída.' : 'O retorno precisa ser depois do horário de ida.');
  if (!p.destino) throw erro_('VALIDACAO', 'Informe o local de destino.');
  if (!p.passageiros.length) throw erro_('VALIDACAO', 'Informe quem vai no carro.');
  if (p.data < hoje_()) throw erro_('VALIDACAO', 'A data já passou.');
  return p;
}

function comoPlanilha_(p) {
  return { Data: p.data, HoraIda: p.horaIda, HoraRetorno: p.horaRetorno, Modo: p.modo, Trajeto: p.trajeto };
}

function checarConflito_(p, ignorarSolId) {
  const c = conflitoBlocos_(eventosDoDia_(p.data), veiculosAtivos_(), p.data, blocos_(comoPlanilha_(p)), ignorarSolId);
  if (c.conflito && !p.urgente) {
    throw erro_('CONFLITO', 'Esse horário já está ocupado: ' + c.ocupados + ' de ' + c.capacidade +
      ' veículo(s) agendado(s). Escolha outro horário, peça encaixe numa viagem ou marque "Solicitar mesmo assim".');
  }
  if (c.conflito && !p.justificativa) throw erro_('VALIDACAO', 'Explique a urgência para pedir um horário ocupado.');
  return c;
}

function acaoCriar_(u, r) {
  if (r.tipo === 'ENCAIXE') return criarEncaixe_(u, r);
  // o modo da viagem (acompanha / leva e busca) é definido pela administração na aprovação
  const p = validarPedido_(Object.assign({}, r, { modo: 'ACOMPANHA' }));
  const c = checarConflito_(p, '');
  const urgente = c.conflito;
  const s = {
    ID: proximoId_(), CriadoEm: agora_(), AtualizadoEm: agora_(), UsuarioID: u.ID,
    Solicitante: u.Nome, Email: u.Email, Setor: u.Setor, Data: p.data, HoraIda: p.horaIda,
    HoraRetorno: p.horaRetorno, Destino: p.destino, Passageiros: p.passageiros.join('\n'),
    Finalidade: p.finalidade, Urgente: urgente ? 'SIM' : 'NAO',
    Justificativa: urgente ? p.justificativa : '', Status: ST.PENDENTE, VeiculoID: '', Placa: '',
    Motorista: '', EventoID: '', ObsAdmin: '', Proposta: '', Historico: '[]',
    Tipo: 'NORMAL', EncaixeDe: '', Modo: p.modo, Trajeto: p.modo === 'LEVA_BUSCA' ? String(p.trajeto) : '',
  };
  registrar_(s, u, urgente ? 'Solicitação enviada como urgente (horário já ocupado)' : 'Solicitação enviada');
  inserir_('Solicitacoes', s);

  enviar_(s.Email, 'Recebemos sua solicitação #' + s.ID,
    emailHtml_('Solicitação recebida', 'Sua solicitação de veículo foi registrada e está aguardando aprovação. Você receberá um e-mail a cada atualização.', s));
  enviar_(emailsAdmins_(), (urgente ? 'URGENTE — ' : '') + 'Nova solicitação #' + s.ID + ' de ' + s.Solicitante,
    emailHtml_('Nova solicitação de veículo', s.Solicitante + ' pediu um veículo.' +
      (urgente ? ' O horário já está ocupado; o pedido foi marcado como urgente.' : ''), s));
  return solPublica_(s);
}

function criarEncaixe_(u, r) {
  const sols = lerTodos_('Solicitacoes');
  const base = acharSolEm_(sols, r.encaixeDe);
  if (base.Tipo === 'ENCAIXE') throw erro_('VALIDACAO', 'Escolha a viagem principal para pedir o encaixe.');
  if (base.UsuarioID === u.ID) throw erro_('VALIDACAO', 'Essa viagem já é sua.');
  if (AGENDADAS.indexOf(base.Status) === -1 || base.Data < hoje_()) throw erro_('VALIDACAO', 'Essa viagem não aceita mais encaixe.');
  if (encaixesDe_(sols, base.ID, [ST.PENDENTE, ST.PRE, ST.CONFIRMADA]).some(function (x) { return x.UsuarioID === u.ID; })) {
    throw erro_('VALIDACAO', 'Você já pediu encaixe nessa viagem.');
  }
  const destino = up_(r.destino);
  const passageiros = upLinhas_(r.passageiros);
  if (!destino) throw erro_('VALIDACAO', 'Informe para onde você vai.');
  if (!passageiros.length) throw erro_('VALIDACAO', 'Informe quem vai no encaixe.');

  const s = {
    ID: proximoId_(), CriadoEm: agora_(), AtualizadoEm: agora_(), UsuarioID: u.ID,
    Solicitante: u.Nome, Email: u.Email, Setor: u.Setor, Data: base.Data, HoraIda: base.HoraIda,
    HoraRetorno: base.HoraRetorno, Destino: destino, Passageiros: passageiros.join('\n'),
    Finalidade: up_(r.finalidade), Urgente: 'NAO', Justificativa: '', Status: ST.PENDENTE,
    VeiculoID: '', Placa: '', Motorista: '', EventoID: '', ObsAdmin: '', Proposta: '', Historico: '[]',
    Tipo: 'ENCAIXE', EncaixeDe: base.ID, Modo: base.Modo, Trajeto: base.Trajeto,
  };
  registrar_(s, u, 'Pedido de encaixe na viagem #' + base.ID + ' (' + base.Destino + ', ' + base.Solicitante + ')');
  inserir_('Solicitacoes', s);
  enviar_(s.Email, 'Recebemos seu pedido de encaixe #' + s.ID,
    emailHtml_('Pedido de encaixe recebido', 'Você pediu para ir junto na viagem #' + base.ID + ' (' + base.Destino + ', de ' + base.Solicitante + '). A administração vai analisar.', s));
  enviar_(emailsAdmins_(), 'Pedido de encaixe #' + s.ID + ' na viagem #' + base.ID,
    emailHtml_('Pedido de encaixe', s.Solicitante + ' pediu encaixe na viagem #' + base.ID + ' de ' + base.Solicitante + ' (' + base.Destino + ').', s));
  return solPublica_(s);
}

function acaoAlterar_(u, r, admin) {
  const s = acharSol_(r.id);
  if (s.UsuarioID !== u.ID && !admin) throw erro_('PERMISSAO', 'Você só pode alterar as suas solicitações.');
  if (s.Tipo === 'ENCAIXE') throw erro_('VALIDACAO', 'Para mudar um encaixe, cancele e peça de novo.');
  if ([ST.PENDENTE, ST.PRE, ST.CONFIRMADA, ST.ALTERACAO].indexOf(s.Status) === -1) {
    throw erro_('STATUS', 'Esta solicitação não pode mais ser alterada.');
  }
  // quem pede não muda o modo da viagem; ele segue o que a administração definiu
  const p = validarPedido_(admin ? r : Object.assign({}, r, { modo: s.Modo || 'ACOMPANHA', trajeto: s.Trajeto }));
  const c = checarConflito_(p, s.ID);
  const urgente = c.conflito;

  if (s.Status === ST.PENDENTE) {
    s.Data = p.data; s.HoraIda = p.horaIda; s.HoraRetorno = p.horaRetorno; s.Destino = p.destino;
    s.Passageiros = p.passageiros.join('\n'); s.Finalidade = p.finalidade;
    s.Modo = p.modo; s.Trajeto = p.modo === 'LEVA_BUSCA' ? String(p.trajeto) : '';
    s.Urgente = urgente ? 'SIM' : 'NAO'; s.Justificativa = urgente ? p.justificativa : '';
    registrar_(s, u, 'Solicitação editada antes da aprovação');
    atualizar_('Solicitacoes', s);
    enviar_(emailsAdmins_(), 'Solicitação #' + s.ID + ' foi editada',
      emailHtml_('Solicitação editada', s.Solicitante + ' editou a solicitação, que continua aguardando aprovação.', s));
  } else {
    let anterior = s.Status;
    if (s.Status === ST.ALTERACAO) {
      try { anterior = JSON.parse(s.Proposta).statusAnterior || ST.CONFIRMADA; } catch (e) { anterior = ST.CONFIRMADA; }
    }
    s.Proposta = JSON.stringify({
      data: p.data, horaIda: p.horaIda, horaRetorno: p.horaRetorno, destino: p.destino,
      passageiros: p.passageiros, finalidade: p.finalidade, urgente: urgente,
      justificativa: urgente ? p.justificativa : '', modo: p.modo, trajeto: p.trajeto, statusAnterior: anterior,
    });
    s.Status = ST.ALTERACAO;
    registrar_(s, u, 'Pedido de alteração enviado');
    atualizar_('Solicitacoes', s);
    enviar_(s.Email, 'Pedido de alteração da solicitação #' + s.ID,
      emailHtml_('Pedido de alteração recebido', 'Recebemos seu pedido de alteração. Até ele ser aprovado, vale o agendamento que já estava marcado.', s));
    enviar_(emailsAdmins_(), (urgente ? 'URGENTE — ' : '') + 'Alteração pedida na solicitação #' + s.ID,
      emailHtml_('Pedido de alteração', s.Solicitante + ' pediu para alterar um agendamento.', s));
  }
  return solPublica_(s);
}

function acaoCancelar_(u, r, admin) {
  const sols = lerTodos_('Solicitacoes');
  const s = acharSolEm_(sols, r.id);
  if (s.UsuarioID !== u.ID && !admin) throw erro_('PERMISSAO', 'Você só pode cancelar as suas solicitações.');
  if ([ST.PENDENTE, ST.PRE, ST.CONFIRMADA, ST.ALTERACAO].indexOf(s.Status) === -1) {
    throw erro_('STATUS', 'Esta solicitação não pode mais ser cancelada.');
  }
  const motivo = up_(r.motivo);
  apagarEventos_(s);
  s.EventoID = '';
  s.Status = ST.CANCELADA;
  s.Proposta = '';
  const peloAdmin = admin && s.UsuarioID !== u.ID;
  if (peloAdmin) s.ObsAdmin = motivo;
  registrar_(s, u, (peloAdmin ? 'Cancelado pela administração' : 'Cancelado pelo solicitante') + (motivo ? ': ' + motivo : ''));
  atualizar_('Solicitacoes', s);

  if (peloAdmin) {
    enviar_(s.Email, 'Agendamento #' + s.ID + ' cancelado',
      emailHtml_('Agendamento cancelado', 'A administração cancelou este agendamento.' + (motivo ? ' Motivo: ' + motivo : ''), s));
  } else {
    enviar_(s.Email, 'Você cancelou a solicitação #' + s.ID,
      emailHtml_('Solicitação cancelada', 'Confirmamos o cancelamento da sua solicitação.', s));
    enviar_(emailsAdmins_(), 'Solicitação #' + s.ID + ' cancelada por ' + s.Solicitante,
      emailHtml_('Solicitação cancelada', s.Solicitante + ' cancelou a solicitação.' + (motivo ? ' Motivo: ' + motivo : ''), s));
  }

  if (s.Tipo === 'ENCAIXE') {
    // tira o encaixe da descrição do evento da viagem principal
    const base = sols.find(function (x) { return x.ID === s.EncaixeDe; });
    if (base && AGENDADAS.indexOf(base.Status) > -1) {
      try { base.EventoID = gravarEventos_(base, sols); atualizar_('Solicitacoes', base); } catch (e) { console.warn(e); }
    }
  } else {
    sincronizarEncaixes_(s, u, sols);
  }
  return solPublica_(s);
}

/*
 * Mantém os encaixes de uma viagem em dia com ela: mesmo dia, horário, veículo e motorista.
 * Se a viagem principal for cancelada, os encaixes também são (com aviso por e-mail).
 */
function sincronizarEncaixes_(base, u, sols) {
  encaixesDe_(sols, base.ID, [ST.PENDENTE, ST.PRE, ST.CONFIRMADA]).forEach(function (e) {
    const avisos = [];
    if (base.Status === ST.CANCELADA || base.Status === ST.RECUSADA) {
      e.Status = ST.CANCELADA;
      e.ObsAdmin = 'A viagem principal #' + base.ID + ' foi cancelada.';
      registrar_(e, u, 'Cancelado: a viagem principal #' + base.ID + ' foi cancelada');
      atualizar_('Solicitacoes', e);
      enviar_(e.Email, 'Encaixe #' + e.ID + ' cancelado',
        emailHtml_('Encaixe cancelado', 'A viagem em que você tinha encaixe foi cancelada. Se ainda precisar do carro, faça um novo pedido.', e));
      return;
    }
    if (e.Data !== base.Data || e.HoraIda !== base.HoraIda || e.HoraRetorno !== base.HoraRetorno || e.Modo !== base.Modo) {
      e.Data = base.Data; e.HoraIda = base.HoraIda; e.HoraRetorno = base.HoraRetorno; e.Modo = base.Modo; e.Trajeto = base.Trajeto;
      avisos.push('A viagem principal #' + base.ID + ' mudou para ' + dataExtenso_(base.Data) + ', ' + textoHorario_(base));
    }
    if (e.Status !== ST.PENDENTE) {
      if (e.Motorista !== base.Motorista && base.Motorista) avisos.push('Motorista definido: ' + base.Motorista);
      if (e.Placa !== base.Placa) avisos.push('Veículo alterado para ' + base.Placa);
      e.VeiculoID = base.VeiculoID; e.Placa = base.Placa; e.Motorista = base.Motorista;
      e.Status = AGENDADAS.indexOf(base.Status) > -1 ? base.Status : e.Status;
    }
    if (!avisos.length) return;
    avisos.forEach(function (a) { registrar_(e, u, a); });
    atualizar_('Solicitacoes', e);
    enviar_(e.Email, 'Seu encaixe #' + e.ID + ' foi atualizado',
      emailHtml_('Encaixe atualizado', avisos.join('. ') + '.', e));
  });
}

function acaoListar_() {
  const sols = lerTodos_('Solicitacoes');
  const veics = veiculosAtivos_();
  const cache = {};
  return sols.map(function (s) {
    const o = solPublica_(s);
    if ((s.Status === ST.PENDENTE || s.Status === ST.ALTERACAO) && s.Tipo !== 'ENCAIXE') {
      const d = dadosEfetivos_(s);
      if (d.Data >= hoje_()) {
        try {
          if (!cache[d.Data]) cache[d.Data] = eventosDoDia_(d.Data);
          o.conflito = conflitoBlocos_(cache[d.Data], veics, d.Data, blocos_(d), s.ID);
        } catch (e) { o.conflito = null; }
      }
    }
    return o;
  }).sort(ordenarSols_);
}

function acaoAprovar_(u, r) {
  const sols = lerTodos_('Solicitacoes');
  const s = acharSolEm_(sols, r.id);
  if ([ST.PENDENTE, ST.ALTERACAO, ST.PRE, ST.CONFIRMADA].indexOf(s.Status) === -1) {
    throw erro_('STATUS', 'Esta solicitação não pode ser aprovada.');
  }
  if (s.Tipo === 'ENCAIXE') return aprovarEncaixe_(u, r, s, sols);

  const veics = veiculosAtivos_();
  let v = null;
  if (r.veiculoId) v = veics.find(function (x) { return x.ID === String(r.veiculoId); });
  if (veics.length && !v) throw erro_('VALIDACAO', 'Escolha o veículo.');
  const depois = !!r.definirDepois;
  let motorista = depois ? '' : up_(r.motorista);
  if (!depois && !motorista && v && v.Motorista) motorista = up_(v.Motorista);
  if (!depois && !motorista) throw erro_('VALIDACAO', 'Informe quem vai dirigir ou escolha "Definir depois".');

  const antes = s.Status;
  {
    const ef = dadosEfetivos_(s);
    const efModo = r.modo ? { Data: ef.Data, HoraIda: r.modo === 'LEVA_BUSCA' && r.horaLevar ? r.horaLevar : ef.HoraIda,
      HoraRetorno: r.modo === 'LEVA_BUSCA' && r.horaBuscar ? r.horaBuscar : ef.HoraRetorno, Modo: r.modo } : ef;
    checarBloqueios_(v, motorista, efModo.Data, blocos_(efModo));
  }
  if (antes === ST.ALTERACAO && s.Proposta) {
    const p = JSON.parse(s.Proposta);
    s.Data = p.data; s.HoraIda = p.horaIda; s.HoraRetorno = p.horaRetorno; s.Destino = p.destino;
    s.Passageiros = p.passageiros.join('\n'); s.Finalidade = p.finalidade;
    s.Urgente = p.urgente ? 'SIM' : 'NAO'; s.Justificativa = p.justificativa || '';
    s.Modo = p.modo || 'ACOMPANHA'; s.Trajeto = p.modo === 'LEVA_BUSCA' ? String(p.trajeto || 30) : '';
  }
  if (r.modo) s.Modo = r.modo === 'LEVA_BUSCA' ? 'LEVA_BUSCA' : 'ACOMPANHA';
  s.Trajeto = '';
  if (s.Modo === 'LEVA_BUSCA' && (r.horaLevar || r.horaBuscar)) {
    const lv = String(r.horaLevar || s.HoraIda), bs = String(r.horaBuscar || s.HoraRetorno);
    if (!/^\d{2}:\d{2}$/.test(lv) || !/^\d{2}:\d{2}$/.test(bs)) throw erro_('VALIDACAO', 'Informe a hora de levar e a hora de buscar.');
    if (bs <= lv) throw erro_('VALIDACAO', 'A hora de buscar precisa ser depois da hora de levar.');
    s.HoraIda = lv; s.HoraRetorno = bs;
  }
  s.VeiculoID = v ? v.ID : '';
  s.Placa = v ? normPlaca_(v.Placa) : '';
  s.Motorista = motorista;
  s.ObsAdmin = up_(r.obs);
  s.Status = motorista ? ST.CONFIRMADA : ST.PRE;
  s.Proposta = '';
  s.EventoID = gravarEventos_(s, sols);

  const detalhe = (s.Placa ? ' — veículo ' + s.Placa : '') + (motorista ? ', motorista ' + motorista : ', motorista a definir');
  let acao, titulo, intro;
  if (antes === ST.ALTERACAO) {
    acao = 'Alteração aprovada' + detalhe; titulo = 'Alteração aprovada';
    intro = 'Seu pedido de alteração foi aprovado. Estes são os dados que valem agora:';
  } else if (antes === ST.PRE && s.Status === ST.CONFIRMADA) {
    acao = 'Motorista definido: ' + motorista; titulo = 'Agendamento confirmado';
    intro = 'O motorista da sua viagem foi definido. Está tudo confirmado:';
  } else if (antes === s.Status) {
    acao = 'Agendamento atualizado pela administração' + detalhe; titulo = 'Agendamento atualizado';
    intro = 'A administração atualizou os dados do seu agendamento:';
  } else if (s.Status === ST.PRE) {
    acao = 'Pré-agendado' + detalhe; titulo = 'Carro reservado (pré-agendado)';
    intro = 'Seu pedido foi aceito e o carro está reservado. O motorista será definido perto da data, e você recebe outro e-mail quando isso acontecer.';
  } else {
    acao = 'Confirmado' + detalhe; titulo = 'Agendamento confirmado';
    intro = 'Seu pedido de veículo foi confirmado e já está no Google Agenda.';
  }
  registrar_(s, u, acao);
  atualizar_('Solicitacoes', s);
  enviar_(s.Email, titulo + ' — solicitação #' + s.ID, emailHtml_(titulo, intro, s));
  sincronizarEncaixes_(s, u, sols);
  return solPublica_(s);
}

/* Agendamento feito pela própria administração: já entra confirmado (ou pré-agendado, sem motorista). */
function acaoAgendarDireto_(u, r) {
  const p = validarPedido_(r);
  const veics = veiculosAtivos_();
  const v = veics.find(function (x) { return x.ID === String(r.veiculoId || ''); });
  if (veics.length && !v) throw erro_('VALIDACAO', 'Escolha o veículo.');
  const depois = !!r.definirDepois;
  let motorista = depois ? '' : up_(r.motorista);
  if (!depois && !motorista && v && v.Motorista) motorista = up_(v.Motorista);
  if (!depois && !motorista) throw erro_('VALIDACAO', 'Informe quem vai dirigir ou escolha "Definir depois".');
  checarBloqueios_(v, motorista, p.data, blocos_(comoPlanilha_(p)));
  if (v && !r.forcar) {
    const placa = normPlaca_(v.Placa);
    const bls = blocos_(comoPlanilha_(p));
    const ocupado = eventosDoDia_(p.data).some(function (e) {
      return e.placa === placa && bls.some(function (b) {
        return e.ini < dt_(p.data, hm_(b.b)).getTime() && e.fimMs > dt_(p.data, hm_(b.a)).getTime();
      });
    });
    if (ocupado) throw erro_('CONFLITO', 'O veículo ' + placa + ' já está agendado nesse horário.');
  }
  const s = {
    ID: proximoId_(), CriadoEm: agora_(), AtualizadoEm: agora_(), UsuarioID: u.ID,
    Solicitante: up_(r.solicitante) || up_(u.Nome), Email: u.Email,
    Setor: up_(r.setor) || up_(u.Setor), Data: p.data, HoraIda: p.horaIda,
    HoraRetorno: p.horaRetorno, Destino: p.destino, Passageiros: p.passageiros.join('\n'),
    Finalidade: p.finalidade, Urgente: 'NAO', Justificativa: '', Status: motorista ? ST.CONFIRMADA : ST.PRE,
    VeiculoID: v ? v.ID : '', Placa: v ? normPlaca_(v.Placa) : '', Motorista: motorista, EventoID: '',
    ObsAdmin: up_(r.obs), Proposta: '', Historico: '[]', Tipo: 'NORMAL', EncaixeDe: '',
    Modo: p.modo, Trajeto: p.modo === 'LEVA_BUSCA' ? String(p.trajeto) : '',
  };
  registrar_(s, u, 'Agendado pela administração' + (s.Placa ? ' — veículo ' + s.Placa : '') + (motorista ? ', motorista ' + motorista : ', motorista a definir'));
  s.EventoID = gravarEventos_(s, []);
  inserir_('Solicitacoes', s);
  return solPublica_(s);
}

function aprovarEncaixe_(u, r, s, sols) {
  const base = sols.find(function (x) { return x.ID === s.EncaixeDe; });
  if (!base || AGENDADAS.indexOf(base.Status) === -1) {
    throw erro_('VALIDACAO', 'A viagem principal (#' + s.EncaixeDe + ') não está mais agendada. Recuse este encaixe.');
  }
  const jaEra = AGENDADAS.indexOf(s.Status) > -1;
  s.Data = base.Data; s.HoraIda = base.HoraIda; s.HoraRetorno = base.HoraRetorno; s.Modo = base.Modo; s.Trajeto = base.Trajeto;
  s.VeiculoID = base.VeiculoID; s.Placa = base.Placa; s.Motorista = base.Motorista;
  s.ObsAdmin = up_(r.obs);
  s.Status = base.Status;
  registrar_(s, u, jaEra ? 'Encaixe atualizado pela administração' : 'Encaixe aprovado na viagem #' + base.ID + (base.Placa ? ' — veículo ' + base.Placa : ''));
  atualizar_('Solicitacoes', s);
  try { base.EventoID = gravarEventos_(base, sols); atualizar_('Solicitacoes', base); } catch (e) { console.warn(e); }
  if (!jaEra) {
    enviar_(s.Email, 'Encaixe aprovado — solicitação #' + s.ID,
      emailHtml_('Encaixe aprovado', 'Você vai junto na viagem #' + base.ID + ' de ' + base.Solicitante + ' (' + base.Destino + ').' +
        (base.Motorista ? '' : ' O motorista ainda será definido; você recebe um e-mail quando isso acontecer.'), s));
  }
  return solPublica_(s);
}

function acaoRecusar_(u, r) {
  const s = acharSol_(r.id);
  const motivo = up_(r.motivo);
  if (!motivo) throw erro_('VALIDACAO', 'Informe o motivo da recusa.');
  if (s.Status === ST.ALTERACAO) {
    let anterior = ST.CONFIRMADA;
    try { anterior = JSON.parse(s.Proposta).statusAnterior || ST.CONFIRMADA; } catch (e) { }
    s.Status = anterior;
    s.Proposta = '';
    registrar_(s, u, 'Alteração não aprovada: ' + motivo);
    atualizar_('Solicitacoes', s);
    enviar_(s.Email, 'Alteração não aprovada — solicitação #' + s.ID,
      emailHtml_('Alteração não aprovada', 'Seu pedido de alteração não foi aprovado. Motivo: ' + motivo +
        '. O agendamento original continua valendo:', s));
  } else if (s.Status === ST.PENDENTE) {
    s.Status = ST.RECUSADA;
    s.ObsAdmin = motivo;
    registrar_(s, u, 'Recusado: ' + motivo);
    atualizar_('Solicitacoes', s);
    enviar_(s.Email, (s.Tipo === 'ENCAIXE' ? 'Encaixe #' : 'Solicitação #') + s.ID + ' não aprovado',
      emailHtml_(s.Tipo === 'ENCAIXE' ? 'Encaixe não aprovado' : 'Solicitação não aprovada',
        'Seu pedido não pôde ser atendido. Motivo: ' + motivo + '. Você pode fazer um novo pedido.', s));
  } else {
    throw erro_('STATUS', 'Esta solicitação não está aguardando aprovação.');
  }
  return solPublica_(s);
}

function acaoResumoDia_(r) {
  const data = String(r.data || hoje_());
  const a = dt_(data, '00:00');
  const b = new Date(a.getTime() + 864e5);
  const sols = lerTodos_('Solicitacoes');
  const porId = {};
  sols.forEach(function (s) { porId[s.ID] = s; });
  const veics = {};
  lerTodos_('Veiculos').forEach(function (v) { veics[normPlaca_(v.Placa)] = v; });
  const bloqs = bloqueiosEntre_(a.getTime(), b.getTime()).map(function (x) {
    const v = veics[x.Placa];
    return { bloqueio: { tipo: x.Tipo, placa: x.Placa, modelo: v ? v.Modelo : '', motorista: x.Motorista, motivo: x.Motivo, inicio: x.Inicio, fim: x.Fim } };
  });
  return eventosPeriodo_(a, b).filter(function (e) { return !e.bloqueioId; }).map(function (e) {
    const s = e.solicitacaoId && porId[e.solicitacaoId];
    const v = veics[e.placa];
    return {
      inicio: e.diaTodo || e.ini < a.getTime() ? '' : fmt_(new Date(e.ini), 'HH:mm'),
      fim: e.diaTodo || e.fimMs > b.getTime() ? '' : fmt_(new Date(e.fimMs), 'HH:mm'),
      diaTodo: e.diaTodo, titulo: e.titulo, local: e.local, placa: e.placa, perna: e.perna,
      modelo: v ? v.Modelo : '', motoristaFixo: v ? v.Motorista : '', sol: s ? solPublica_(s) : null,
      encaixes: s ? encaixesDe_(sols, s.ID).map(solPublica_) : [],
    };
  }).sort(function (x, y) { return (x.inicio || '00:00').localeCompare(y.inicio || '00:00'); }).concat(bloqs);
}

/* ============================ BLOQUEIOS ============================ */
// Carro em manutenção/revisão ou motorista de férias/folga: fica indisponível no período.

function bloqPublico_(x) {
  return { id: x.ID, tipo: x.Tipo, veiculoId: x.VeiculoID, placa: x.Placa, motorista: x.Motorista, inicio: x.Inicio, fim: x.Fim, motivo: x.Motivo, criadoPor: x.CriadoPor };
}

function msDe_(dataHora) {
  const p = String(dataHora).split(' ');
  return dt_(p[0], p[1] || '00:00').getTime();
}

function bloqueiosEntre_(a, b) {
  return lerTodos_('Bloqueios').filter(function (x) { return msDe_(x.Inicio) < b && msDe_(x.Fim) > a; });
}

function checarBloqueios_(v, motorista, data, bls) {
  bls.forEach(function (bl) {
    const a = dt_(data, hm_(bl.a)).getTime(), b = dt_(data, hm_(bl.b)).getTime();
    bloqueiosEntre_(a, b).forEach(function (x) {
      if (x.Tipo === 'VEICULO' && v && x.VeiculoID === v.ID) {
        throw erro_('BLOQUEIO', 'O veículo ' + x.Placa + ' está bloqueado nesse horário (' + x.Motivo + ', até ' + fmtBloq_(x.Fim) + '). Escolha outro carro.');
      }
      if (x.Tipo === 'MOTORISTA' && motorista && up_(x.Motorista) === up_(motorista)) {
        throw erro_('BLOQUEIO', x.Motorista + ' está indisponível nesse horário (' + x.Motivo + ', até ' + fmtBloq_(x.Fim) + '). Escolha outro motorista.');
      }
    });
  });
}

function fmtBloq_(dataHora) {
  const p = String(dataHora).split(' ');
  const d = p[0].split('-');
  return d[2] + '/' + d[1] + (p[1] && p[1] !== '23:59' && p[1] !== '00:00' ? ' às ' + p[1] : '');
}

function acaoSalvarBloqueio_(u, r) {
  const tipo = r.tipo === 'MOTORISTA' ? 'MOTORISTA' : 'VEICULO';
  const de = String(r.de || ''), ate = String(r.ate || de);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(de) || !/^\d{4}-\d{2}-\d{2}$/.test(ate)) throw erro_('VALIDACAO', 'Informe o período.');
  const hi = r.diaInteiro === false ? String(r.horaInicio || '') : '00:00';
  const hf = r.diaInteiro === false ? String(r.horaFim || '') : '23:59';
  if (!/^\d{2}:\d{2}$/.test(hi) || !/^\d{2}:\d{2}$/.test(hf)) throw erro_('VALIDACAO', 'Informe os horários do bloqueio.');
  const inicio = de + ' ' + hi, fim = ate + ' ' + hf;
  if (msDe_(fim) <= msDe_(inicio)) throw erro_('VALIDACAO', 'O fim do bloqueio precisa ser depois do início.');
  const motivo = up_(r.motivo);
  if (!motivo) throw erro_('VALIDACAO', 'Informe o motivo.');

  const x = { ID: 'B' + Utilities.getUuid().slice(0, 8), Tipo: tipo, VeiculoID: '', Placa: '', Motorista: '', Inicio: inicio, Fim: fim,
    Motivo: motivo, EventoID: '', CriadoEm: agora_(), CriadoPor: u.Nome };
  if (tipo === 'VEICULO') {
    const v = lerTodos_('Veiculos').find(function (y) { return y.ID === String(r.veiculoId || ''); });
    if (!v) throw erro_('VALIDACAO', 'Escolha o veículo.');
    x.VeiculoID = v.ID; x.Placa = normPlaca_(v.Placa);
    // entra no Google Agenda com a placa: assim o carro aparece ocupado para todo mundo
    const ev = agenda_().createEvent('[' + x.Placa + '] BLOQUEIO: ' + motivo, dt_(de, hi), dt_(ate, hf),
      { description: 'Veículo indisponível (' + motivo + '). Bloqueio criado pelo sistema Agenda de Veículos.' });
    ev.setTag('bloqueioId', x.ID);
    x.EventoID = ev.getId();
  } else {
    x.Motorista = up_(r.motorista);
    if (!x.Motorista) throw erro_('VALIDACAO', 'Escolha o motorista.');
  }
  inserir_('Bloqueios', x);

  // viagens já marcadas que caem no bloqueio: a administração precisa remanejar
  const a = msDe_(inicio), b = msDe_(fim);
  const afetadas = lerTodos_('Solicitacoes').filter(function (s) {
    if (s.Tipo === 'ENCAIXE' || [ST.PRE, ST.CONFIRMADA, ST.ALTERACAO].indexOf(s.Status) === -1) return false;
    if (tipo === 'VEICULO' ? s.VeiculoID !== x.VeiculoID : up_(s.Motorista) !== x.Motorista) return false;
    return blocos_(s).some(function (bl) { return dt_(s.Data, hm_(bl.a)).getTime() < b && dt_(s.Data, hm_(bl.b)).getTime() > a; });
  }).map(solPublica_).sort(function (p, q) { return (p.data + p.horaIda).localeCompare(q.data + q.horaIda); });
  return { bloqueio: bloqPublico_(x), afetadas: afetadas };
}

function acaoRemoverBloqueio_(r) {
  const x = lerTodos_('Bloqueios').find(function (y) { return y.ID === r.id; });
  if (!x) throw erro_('NAO_ENCONTRADO', 'Bloqueio não encontrado.');
  if (x.EventoID) apagarEventos_(x);
  aba_('Bloqueios').deleteRow(x._linha);
  return true;
}

/* ============================ ESQUECI MINHA SENHA ============================ */
// Código de 6 dígitos enviado por e-mail, válido por 30 minutos e com até 5 tentativas.

function acharPorLoginOuEmail_(ident) {
  const id = String(ident || '').trim().toLowerCase();
  if (!id) return null;
  return lerTodos_('Usuarios').find(function (x) {
    return String(x.Login).toLowerCase() === id || String(x.Email).toLowerCase() === id;
  }) || null;
}

function acaoEsqueciSenha_(r) {
  if (!String(r.identificador || '').trim()) throw erro_('VALIDACAO', 'Informe seu login ou e-mail.');
  const u = acharPorLoginOuEmail_(r.identificador);
  // a resposta é sempre a mesma, para não revelar quem tem cadastro
  const resposta = { enviado: true };
  if (!u || u.Ativo === 'NAO' || !u.Email) return resposta;
  const agora = Date.now();
  const emitidoEm = Number(u.CodigoValidade || 0) - 30 * 60000;
  if (emitidoEm > agora - 60000) return resposta; // já mandou um código há menos de 1 minuto
  const codigo = String(Math.floor(100000 + Math.random() * 900000));
  u.CodigoSenha = hashSenha_(u.ID, 'codigo:' + codigo);
  u.CodigoValidade = String(agora + 30 * 60000);
  u.CodigoTentativas = '0';
  atualizar_('Usuarios', u);
  enviar_(u.Email, 'Código para criar uma nova senha', emailSimples_('Esqueci minha senha',
    '<p>Use este código para criar uma nova senha:</p>' +
    '<p style="font-size:30px;font-weight:bold;letter-spacing:6px;margin:10px 0">' + codigo + '</p>' +
    '<p>Seu login: <b>' + esc_(u.Login) + '</b><br>O código vale por 30 minutos. Se não foi você que pediu, ignore este e-mail: sua senha continua a mesma.</p>'));
  return resposta;
}

function acaoRedefinirSenha_(r) {
  const u = acharPorLoginOuEmail_(r.identificador);
  const invalido = 'Código inválido ou vencido. Peça um novo código.';
  if (!u || !u.CodigoSenha || Date.now() > Number(u.CodigoValidade || 0)) throw erro_('CODIGO', invalido);
  const tentativas = Number(u.CodigoTentativas || 0);
  if (tentativas >= 5) throw erro_('CODIGO', 'Muitas tentativas erradas. Peça um novo código.');
  if (hashSenha_(u.ID, 'codigo:' + String(r.codigo || '').trim()) !== u.CodigoSenha) {
    u.CodigoTentativas = String(tentativas + 1);
    atualizar_('Usuarios', u);
    throw erro_('CODIGO', 'Código incorreto. Confira o número que chegou no seu e-mail.');
  }
  const nova = String(r.nova || '');
  if (nova.length < 6) throw erro_('SENHA', 'A nova senha precisa ter pelo menos 6 caracteres.');
  if (nova.toLowerCase() === String(CONFIG.SENHA_PADRAO).toLowerCase()) throw erro_('SENHA', 'Escolha uma senha diferente da senha padrão.');
  u.SenhaHash = hashSenha_(u.ID, nova);
  u.TrocarSenha = 'NAO';
  u.CodigoSenha = ''; u.CodigoValidade = ''; u.CodigoTentativas = '';
  atualizar_('Usuarios', u);
  return { login: u.Login };
}

/* ============================ AVISOS DO SOLICITANTE ============================ */

// Atualizações feitas por outras pessoas (administração) nos pedidos do usuário, últimos 60 dias.
function acaoNovidades_(u) {
  const visto = String(u.VistoEm || '');
  const limite = fmt_(new Date(Date.now() - 60 * 864e5), 'yyyy-MM-dd HH:mm:ss');
  const itens = [];
  lerTodos_('Solicitacoes').forEach(function (s) {
    if (s.UsuarioID !== u.ID) return;
    let h = [];
    try { h = JSON.parse(s.Historico || '[]'); } catch (e) { }
    h.forEach(function (x) {
      const deOutro = x.porId ? x.porId !== u.ID : x.por !== u.Nome;
      if (!deOutro || String(x.em) < limite) return;
      itens.push({
        solId: s.ID, em: x.em, por: x.por, acao: x.acao, status: s.Status, destino: s.Destino,
        data: s.Data, horaIda: s.HoraIda, horaRetorno: s.HoraRetorno, placa: s.Placa, modo: s.Modo || 'ACOMPANHA',
        motorista: s.Motorista, tipo: s.Tipo || 'NORMAL', novo: !visto || String(x.em) > visto,
      });
    });
  });
  itens.sort(function (a, b) { return String(b.em).localeCompare(String(a.em)); });
  return { novos: itens.filter(function (i) { return i.novo; }).length, itens: itens };
}

/* ============================ CADASTROS ============================ */

function veicPublico_(v) {
  return { id: v.ID, placa: normPlaca_(v.Placa), modelo: v.Modelo, lugares: Number(v.Lugares) || 0, ativo: v.Ativo !== 'NAO', motorista: v.Motorista || '' };
}

function acaoVeiculos_(admin) {
  return lerTodos_('Veiculos').filter(function (v) { return admin || v.Ativo !== 'NAO'; }).map(veicPublico_);
}

function acaoSalvarVeiculo_(u, r) {
  const placa = normPlaca_(r.placa);
  if (!/^[A-Z0-9]{7}$/.test(placa)) throw erro_('VALIDACAO', 'Placa inválida. Use 7 letras e números, ex.: ABC1D23.');
  const lista = lerTodos_('Veiculos');
  if (lista.some(function (v) { return normPlaca_(v.Placa) === placa && v.ID !== r.id; })) {
    throw erro_('VALIDACAO', 'Já existe um veículo com essa placa.');
  }
  let v = r.id ? lista.find(function (x) { return x.ID === r.id; }) : null;
  const existia = !!v;
  const antigo = v ? up_(v.Motorista) : '';
  const motorista = up_(r.motorista);
  const dados = {
    Placa: placa, Modelo: up_(r.modelo), Lugares: String(Number(r.lugares) || ''),
    Ativo: r.ativo === false ? 'NAO' : 'SIM', Motorista: motorista,
  };
  if (v) {
    Object.assign(v, dados);
    atualizar_('Veiculos', v);
  } else {
    v = Object.assign({ ID: 'V' + Utilities.getUuid().slice(0, 8) }, dados);
    inserir_('Veiculos', v);
  }

  // Troca do motorista fixo: opcionalmente leva a troca para as viagens confirmadas futuras deste carro
  let atualizados = 0;
  if (existia && r.atualizarFuturos && motorista && motorista !== antigo) {
    const sols = lerTodos_('Solicitacoes');
    sols.forEach(function (s) {
      if (s.Status !== ST.CONFIRMADA || s.Tipo === 'ENCAIXE' || s.VeiculoID !== v.ID || s.Data < hoje_()) return;
      if (s.Motorista && up_(s.Motorista) !== antigo) return; // motorista escolhido à parte naquela viagem: mantém
      s.Motorista = motorista;
      try { s.EventoID = gravarEventos_(s, sols); } catch (e) { console.warn('Evento não atualizado: ' + e); }
      registrar_(s, u, 'Motorista alterado para ' + motorista);
      atualizar_('Solicitacoes', s);
      enviar_(s.Email, 'Motorista alterado — solicitação #' + s.ID,
        emailHtml_('Motorista alterado', 'O motorista do seu agendamento mudou. Os demais dados continuam iguais:', s));
      sincronizarEncaixes_(s, u, sols);
      atualizados++;
    });
  }
  return { veiculo: veicPublico_(v), atualizados: atualizados };
}

function acaoRemoverVeiculo_(r) {
  const v = lerTodos_('Veiculos').find(function (x) { return x.ID === r.id; });
  if (!v) throw erro_('NAO_ENCONTRADO', 'Veículo não encontrado.');
  aba_('Veiculos').deleteRow(v._linha);
  return true;
}

function motPublico_(m) {
  return { id: m.ID, nome: m.Nome, telefone: m.Telefone, ativo: m.Ativo !== 'NAO' };
}

function acaoSalvarMotorista_(r) {
  const nome = up_(r.nome);
  if (!nome) throw erro_('VALIDACAO', 'Informe o nome do motorista.');
  const tel = String(r.telefone || '').replace(/\D/g, '');
  if (tel && (tel.length < 10 || tel.length > 13)) throw erro_('VALIDACAO', 'Telefone inválido. Use DDD + número, ex.: 27 99999-9999.');
  const lista = lerTodos_('Motoristas');
  if (lista.some(function (m) { return m.Nome.toLowerCase() === nome.toLowerCase() && m.ID !== r.id; })) {
    throw erro_('VALIDACAO', 'Já existe um motorista com esse nome.');
  }
  let m = r.id ? lista.find(function (x) { return x.ID === r.id; }) : null;
  const antigo = m ? m.Nome : '';
  const dados = { Nome: nome, Telefone: tel, Ativo: r.ativo === false ? 'NAO' : 'SIM' };
  if (m) {
    Object.assign(m, dados);
    atualizar_('Motoristas', m);
    if (antigo && antigo !== nome) {
      // mantém o vínculo com os carros em que ele é motorista fixo
      lerTodos_('Veiculos').forEach(function (v) {
        if (up_(v.Motorista) === up_(antigo)) { v.Motorista = nome; atualizar_('Veiculos', v); }
      });
    }
  } else {
    m = Object.assign({ ID: 'M' + Utilities.getUuid().slice(0, 8) }, dados);
    inserir_('Motoristas', m);
  }
  return motPublico_(m);
}

function acaoRemoverMotorista_(r) {
  const m = lerTodos_('Motoristas').find(function (x) { return x.ID === r.id; });
  if (!m) throw erro_('NAO_ENCONTRADO', 'Motorista não encontrado.');
  aba_('Motoristas').deleteRow(m._linha);
  return true;
}

/* ============================ USUÁRIOS ============================ */

function up_(t) {
  return String(t == null ? '' : t).trim().replace(/\s+/g, ' ').toUpperCase();
}

function upLinhas_(v) {
  return (Array.isArray(v) ? v : String(v || '').split('\n')).map(up_).filter(String);
}

function semAcento_(t) {
  return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/* Login no formato NOME.ULTIMOSOBRENOME (sem acentos). Se já existir, acrescenta um número. */
function gerarLogin_(nome, lista, ignorarId) {
  const partes = semAcento_(up_(nome)).replace(/[^A-Z ]/g, '').split(' ').filter(function (p) {
    return p && ['DA', 'DE', 'DO', 'DAS', 'DOS', 'E'].indexOf(p) === -1;
  });
  if (!partes.length) throw erro_('VALIDACAO', 'Informe o nome completo.');
  const base = partes.length > 1 ? partes[0] + '.' + partes[partes.length - 1] : partes[0];
  const usados = lista.filter(function (x) { return x.ID !== ignorarId; }).map(function (x) { return String(x.Login).toUpperCase(); });
  let login = base, n = 2;
  while (usados.indexOf(login) > -1) login = base + (n++);
  return login;
}

function telefone_(t) {
  const d = String(t || '').replace(/\D/g, '');
  if (d && (d.length < 10 || d.length > 11)) throw erro_('VALIDACAO', 'Telefone inválido. Use DDD + número, ex.: 27 99999-9999.');
  return d;
}

function acaoSalvarUsuario_(eu, r) {
  const nome = up_(r.nome);
  const email = String(r.email || '').trim().toLowerCase();
  if (!nome) throw erro_('VALIDACAO', 'Informe o nome.');
  if (!/^\S+@\S+\.\S+$/.test(email)) throw erro_('VALIDACAO', 'Informe um e-mail válido — é por ele que a pessoa recebe as atualizações.');
  const lista = lerTodos_('Usuarios');
  let login = up_(r.login);
  if (!login) login = gerarLogin_(nome, lista, r.id);
  if (!/^[A-Z0-9._-]{3,}$/.test(login)) throw erro_('VALIDACAO', 'Login precisa ter 3 ou mais letras/números, sem espaços.');
  if (lista.some(function (x) { return String(x.Login).toUpperCase() === login && x.ID !== r.id; })) {
    throw erro_('VALIDACAO', 'Esse login já está em uso.');
  }
  let u = r.id ? lista.find(function (x) { return x.ID === r.id; }) : null;
  if (u && u.ID === eu.ID && (r.tipo !== 'admin' || r.ativo === false)) {
    throw erro_('VALIDACAO', 'Você não pode tirar seu próprio acesso de administrador.');
  }
  const dados = { Login: login, Nome: nome, Email: email, Setor: up_(r.setor), Telefone: telefone_(r.telefone),
    Tipo: r.tipo === 'admin' ? 'admin' : 'solicitante', Ativo: r.ativo === false ? 'NAO' : 'SIM' };
  if (u) {
    Object.assign(u, dados);
    if (r.zerarSenha) { u.SenhaHash = hashSenha_(u.ID, CONFIG.SENHA_PADRAO); u.TrocarSenha = 'SIM'; }
    atualizar_('Usuarios', u);
  } else {
    const id = 'U' + Utilities.getUuid().slice(0, 8);
    // sem senha informada: senha padrão, trocada no primeiro acesso
    const senha = String(r.senha || '');
    if (senha && senha.length < 6) throw erro_('VALIDACAO', 'A senha precisa ter pelo menos 6 caracteres.');
    u = Object.assign({ ID: id, SenhaHash: hashSenha_(id, senha || CONFIG.SENHA_PADRAO), CriadoEm: agora_(), TrocarSenha: senha ? 'NAO' : 'SIM' }, dados);
    inserir_('Usuarios', u);
  }
  return usuarioPublico_(u);
}

/* Cadastro feito pela própria pessoa na tela de login. Solicitante entra direto; administrador aguarda aprovação. */
function acaoSolicitarCadastro_(r) {
  const nome = up_(r.nome);
  const email = String(r.email || '').trim().toLowerCase();
  const setor = up_(r.setor);
  const tel = String(r.telefone || '').replace(/\D/g, '');
  const admin = r.perfil === 'admin';
  if (nome.split(' ').length < 2) throw erro_('VALIDACAO', 'Informe o nome completo (nome e sobrenome).');
  if (tel.length < 10 || tel.length > 11) throw erro_('VALIDACAO', 'Informe o telefone com DDD, ex.: 27 99999-9999.');
  if (!/^\S+@\S+\.\S+$/.test(email)) throw erro_('VALIDACAO', 'Informe um e-mail válido.');
  if (!setor) throw erro_('VALIDACAO', 'Informe o setor.');
  const lista = lerTodos_('Usuarios');
  if (lista.some(function (x) { return String(x.Email).toLowerCase() === email; })) {
    throw erro_('VALIDACAO', 'Já existe um cadastro com este e-mail. Entre com seu login ou fale com a administração.');
  }
  const id = 'U' + Utilities.getUuid().slice(0, 8);
  const u = {
    ID: id, Login: gerarLogin_(nome, lista), SenhaHash: hashSenha_(id, CONFIG.SENHA_PADRAO), Nome: nome, Email: email,
    Setor: setor, Tipo: admin ? 'admin' : 'solicitante', Ativo: admin ? 'PENDENTE' : 'SIM', CriadoEm: agora_(),
    Telefone: tel, TrocarSenha: 'SIM',
  };
  inserir_('Usuarios', u);

  const acesso = '<p>Seu login: <b>' + esc_(u.Login) + '</b><br>Senha inicial: <b>' + esc_(CONFIG.SENHA_PADRAO) + '</b><br>No primeiro acesso, o sistema pede para você criar sua própria senha.</p>';
  if (admin) {
    enviar_(email, 'Cadastro de administrador recebido',
      emailSimples_('Cadastro recebido', '<p>Seu pedido de acesso como <b>administrador</b> foi recebido e aguarda aprovação. Você recebe um e-mail quando for liberado.</p>' + acesso));
    enviar_(emailsAdmins_(), 'Pedido de acesso de administrador: ' + nome,
      emailSimples_('Pedido de acesso de administrador', '<p><b>' + esc_(nome) + '</b> (' + esc_(setor) + ', ' + esc_(email) +
        ') pediu acesso como administrador. Aprove ou recuse em Cadastros &gt; Usuários.</p>'));
  } else {
    enviar_(email, 'Seu acesso à agenda de veículos', emailSimples_('Cadastro feito', '<p>Seu cadastro como solicitante está liberado.</p>' + acesso));
  }
  return { login: u.Login, perfil: u.Tipo, pendente: admin, senhaPadrao: CONFIG.SENHA_PADRAO };
}

/* decisao: 'admin' (aprova como administrador), 'solicitante' (libera só para pedir carro) ou 'recusar' (apaga o cadastro) */
function acaoDecidirCadastro_(eu, r) {
  const u = lerTodos_('Usuarios').find(function (x) { return x.ID === r.id; });
  if (!u || u.Ativo !== 'PENDENTE') throw erro_('STATUS', 'Este cadastro não está aguardando aprovação.');
  const login = '<p>Seu login: <b>' + esc_(u.Login) + '</b><br>Senha inicial: <b>' + esc_(CONFIG.SENHA_PADRAO) + '</b> (você cria a sua no primeiro acesso).</p>';
  if (r.decisao === 'recusar') {
    aba_('Usuarios').deleteRow(u._linha);
    enviar_(u.Email, 'Cadastro não aprovado', emailSimples_('Cadastro não aprovado',
      '<p>Seu pedido de acesso como administrador não foi aprovado.' + (r.motivo ? ' Motivo: ' + esc_(up_(r.motivo)) : '') + '</p>'));
    return true;
  }
  u.Tipo = r.decisao === 'admin' ? 'admin' : 'solicitante';
  u.Ativo = 'SIM';
  atualizar_('Usuarios', u);
  enviar_(u.Email, 'Seu acesso foi liberado', emailSimples_('Acesso liberado',
    '<p>Seu acesso foi liberado como <b>' + (u.Tipo === 'admin' ? 'administrador' : 'solicitante') + '</b>.</p>' + login));
  return usuarioPublico_(u);
}

/*
 * Rode UMA VEZ depois de atualizar (selecione "maiusculasExistentes" e clique em Executar):
 * passa para maiúsculas os dados que já estavam na planilha.
 */
function maiusculasExistentes() {
  const campos = {
    Usuarios: ['Nome', 'Setor', 'Login'],
    Motoristas: ['Nome'],
    Veiculos: ['Modelo', 'Motorista'],
    Solicitacoes: ['Solicitante', 'Setor', 'Destino', 'Passageiros', 'Finalidade', 'Justificativa', 'Motorista', 'ObsAdmin'],
  };
  Object.keys(campos).forEach(function (aba) {
    lerTodos_(aba).forEach(function (o) {
      let mudou = false;
      campos[aba].forEach(function (c) {
        const novo = String(o[c] || '').split('\n').map(up_).join('\n');
        if (novo !== String(o[c] || '')) { o[c] = novo; mudou = true; }
      });
      if (mudou) atualizar_(aba, o);
    });
  });
  Logger.log('Dados convertidos para maiúsculas.');
}

function acaoRemoverUsuario_(eu, r) {
  if (r.id === eu.ID) throw erro_('VALIDACAO', 'Você não pode remover o seu próprio usuário.');
  const u = lerTodos_('Usuarios').find(function (x) { return x.ID === r.id; });
  if (!u) throw erro_('NAO_ENCONTRADO', 'Usuário não encontrado.');
  aba_('Usuarios').deleteRow(u._linha);
  return true;
}

/* ============================ E-MAIL ============================ */

function emailsAdmins_() {
  const l = lerTodos_('Usuarios').filter(function (u) { return u.Tipo === 'admin' && u.Ativo !== 'NAO' && u.Email; })
    .map(function (u) { return u.Email; });
  if (CONFIG.EMAIL_ADMIN_EXTRA) l.push(CONFIG.EMAIL_ADMIN_EXTRA);
  return l.filter(function (x, i) { return l.indexOf(x) === i; }).join(',');
}

function enviar_(para, assunto, html) {
  if (!para) return;
  try {
    MailApp.sendEmail({ to: para, subject: '[' + CONFIG.SIGLA_EMAIL + '] ' + assunto, htmlBody: html, name: CONFIG.NOME_SISTEMA });
  } catch (e) {
    console.warn('Falha ao enviar e-mail para ' + para + ': ' + e);
  }
}

function esc_(t) {
  return String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function emailSimples_(titulo, corpoHtml) {
  return '<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#16282b">' +
    '<div style="background:#0e6b5a;color:#fff;padding:18px 22px;border-radius:12px 12px 0 0">' +
    '<div style="font-size:12px;opacity:.85">' + esc_(CONFIG.NOME_SISTEMA) + '</div>' +
    '<div style="font-size:20px;font-weight:bold;margin-top:4px">' + esc_(titulo) + '</div></div>' +
    '<div style="border:1px solid #d9ded9;border-top:0;padding:20px 22px;border-radius:0 0 12px 12px;line-height:1.5">' + corpoHtml +
    '<p style="margin:22px 0 0"><a href="' + CONFIG.URL_SISTEMA + '" style="background:#0e6b5a;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;display:inline-block">Abrir o sistema</a></p>' +
    '</div></div>';
}

function emailHtml_(titulo, intro, s) {
  let p = s;
  let aviso = '';
  if (s.Status === ST.ALTERACAO && s.Proposta) {
    try {
      const pr = JSON.parse(s.Proposta);
      p = { ID: s.ID, Data: pr.data, HoraIda: pr.horaIda, HoraRetorno: pr.horaRetorno, Destino: pr.destino, Modo: pr.modo,
        Passageiros: pr.passageiros.join('\n'), Finalidade: pr.finalidade, Solicitante: s.Solicitante, Setor: s.Setor };
      aviso = '<p style="margin:0 0 12px;color:#8a5a00">Dados propostos na alteração:</p>';
    } catch (e) { }
  }
  const agendado = AGENDADAS.indexOf(s.Status) > -1;
  const linhas = [
    ['Solicitação', '#' + p.ID + (s.Tipo === 'ENCAIXE' ? ' (encaixe na viagem #' + s.EncaixeDe + ')' : '')],

  return '<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#16282b">' +

/* ============================ datas ============================ */
const pad = n => String(n).padStart(2, '0');

const minDe = h => { const [a, b] = String(h || '00:00').split(':').map(Number); return a * 60 + b; };
const hm = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };

/* ============================ ocupação de carro e motorista ============================ */
// Mesma regra do Code.gs: no "leva e busca" o carro fica reservado por RESERVA_LB minutos a partir
// da hora de levar e da hora de buscar; entre as duas, carro e motorista ficam livres.
const RESERVA_LB = 30; // igual a CONFIG.RESERVA_LEVA_BUSCA_MIN no Code.gs
function blocos(s) {
  const a = minDe(s.horaIda), b = minDe(s.horaRetorno);
  if (s.modo !== 'LEVA_BUSCA') return [{ a, b, perna: 'total' }];
  const ida = { a, b: a + RESERVA_LB, perna: 'ida' };
  const volta = { a: b, b: Math.min(1439, b + RESERVA_LB), perna: 'volta' };
  if (volta.a <= ida.b) return [{ a, b: volta.b, perna: 'total' }];
  return [ida, volta];
}
const horasDe = s => blocos(s).reduce((t, b) => t + (b.b - b.a), 0) / 60;
const textoHorario = s => s.modo === 'LEVA_BUSCA' ? `Leva às ${s.horaIda}, busca às ${s.horaRetorno}` : `${s.horaIda} às ${s.horaRetorno}`;

function maxSimultaneo(evs, a, b) {
  const pts = [];
  evs.forEach(e => { pts.push([Math.max(e.s, a), 1]); pts.push([Math.min(e.e, b), -1]); });
  pts.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  let c = 0, m = 0; pts.forEach(p => { c += p[1]; m = Math.max(m, c); }); return m;
}
function calcConflito(eventos, veiculos, data, horaIda, horaRetorno, ignorarSolId) {
  const a = parseDT(`${data} ${horaIda}`).getTime(), b = parseDT(`${data} ${horaRetorno}`).getTime();
  const ativas = veiculos.map(v => v.placa);
  const sobre = eventos.map(e => ({ ...e, s: parseDT(e.inicio).getTime(), e: parseDT(e.fim).getTime() }))
    .filter(e => e.s < b && e.e > a && !(ignorarSolId && e.solicitacaoId === ignorarSolId));
  const placas = []; const sem = [];
  sobre.forEach(e => { if (e.placa && ativas.includes(e.placa)) { if (!placas.includes(e.placa)) placas.push(e.placa); } else sem.push(e); });
  const capacidade = Math.max(1, veiculos.length);
  const total = placas.length + maxSimultaneo(sem, a, b);
  return { conflito: total >= capacidade, ocupados: Math.min(total, capacidade), capacidade, placasOcupadas: placas, semPlaca: sem.length };
}
function conflitoBlocos(eventos, veiculos, data, bls, ignorarSolId) {
  const r = { conflito: false, ocupados: 0, capacidade: Math.max(1, veiculos.length), placasOcupadas: [], semPlaca: 0 };
  bls.forEach(bl => {
    const c = calcConflito(eventos, veiculos, data, hm(bl.a), hm(bl.b), ignorarSolId);
    if (c.conflito) r.conflito = true;
    r.ocupados = Math.max(r.ocupados, c.ocupados); r.semPlaca = Math.max(r.semPlaca, c.semPlaca);
    c.placasOcupadas.forEach(p => { if (!r.placasOcupadas.includes(p)) r.placasOcupadas.push(p); });
  });
  return r;
}

}

  useEffect(() => { if (!aviso) return; const t = setTimeout(fechar, aviso.tipo === 'erro' ? 7000 : 4500); return () => clearTimeout(t); }, [aviso]);

      <p>{aviso.msg}</p>

  );
}

function Modal({ titulo, fechar, children }) {
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') fechar(); };
    window.addEventListener('keydown', k); document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', k); document.body.style.overflow = ''; };
  }, []);
  return (
    <div className="fundo" onClick={fechar}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={titulo} onClick={e => e.stopPropagation()}>
        <div className="modal-cab"><h2>{titulo}</h2><button className="fechar" onClick={fechar} aria-label="Fechar">{I.x}</button></div>
        {children}
      </div>
    </div>
  );
}
